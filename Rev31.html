          <option value="weekday" ${c.mult==='weekday'?'selected':''}>Weekdays ×${otNum('mulWeekday')}</option>
          <option value="weekend" ${c.mult==='weekend'?'selected':''}>Weekends ×${otNum('mulWeekend')}</option>
          <option value="mixed" ${c.mult==='mixed'?'selected':''}>A bit of both</option></select></label>
      </div>
    </div>
    <div class="counter">
      <div class="cap">Hours a week</div>
      <div class="big num">${(hours/wks).toFixed(1)}</div>
      <div class="sub"><span>${hours.toFixed(0)} hours in total</span><span>${(hours/(wks/4.345)).toFixed(1)} a month</span></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">Gross needed</div><div class="v">${gbp(need)}</div></div>
      <div class="stat"><div class="k">Tax &amp; NI</div><div class="v" style="color:var(--warn)">${gbp(deduct)}</div></div>
      <div class="stat"><div class="k">You keep</div><div class="v">${need?((+c.target||0)/need*100).toFixed(0):0}%</div></div>
    </div>
    <p class="note">Worked out at ${gbp(perHour)} an hour, on top of a ${gbp(otNum('baseSalary'))} salary and ${gbp(already)} of overtime already logged this tax year. The keep rate falls as you cross bands, which is why the gross figure is not simply the net plus a fixed percentage.</p>`;
    const t=nextThreshold();
    if(t&&need>Math.max(0,t.gap-already)){
      h+=`<div class="alert"><b>This target crosses a threshold.</b><br>
        The first ${gbp(Math.max(0,t.gap-already))} keeps ${(100-t.before).toFixed(0)}p in the pound.
        After that you are into the ${esc(t.name)} and keeping ${(100-t.after).toFixed(0)}p.
        Stopping just short of the line is the better hourly deal.</div>`;
    }
  }

  if(otTab==='pen'){
    const g=otNum('baseSalary'), bd=payBreakdown(g), type=ot().penType;
    const noPen=(function(){ const keep=ot().penType; ot().penType='none';
      const r=payBreakdown(g); ot().penType=keep; return r; })();
    const cost=noPen.take-bd.take;
    h+=`<div class="card">
      ${srow('How it is taken','Check your payslip — the wording is usually there. Salary sacrifice saves National Insurance as well as tax.',
        `<select data-ot="penType">
          <option value="none" ${type==='none'?'selected':''}>Not in a scheme</option>
          <option value="netpay" ${type==='netpay'?'selected':''}>Net pay arrangement</option>
          <option value="sacrifice" ${type==='sacrifice'?'selected':''}>Salary sacrifice</option>
          <option value="ras" ${type==='ras'?'selected':''}>Relief at source</option></select>`)}
      ${srow('Your contribution %','',`<input type="number" step="0.5" data-ot="penPct" value="${otNum('penPct')}">`)}
      ${srow('Employer contribution %','Does not affect your take-home, but it is part of what the job pays.',
        `<input type="number" step="0.5" data-ot="penEmployer" value="${otNum('penEmployer')}">`)}
      ${srow('Calculated on','Auto-enrolment schemes often use a slice of pay rather than all of it.',
        `<select data-ot="penBasis">
          <option value="full" ${ot().penBasis==='full'?'selected':''}>All pay</option>
          <option value="qualifying" ${ot().penBasis==='qualifying'?'selected':''}>Qualifying earnings</option></select>`)}
      ${ot().penBasis==='qualifying'?`
        ${srow('Qualifying from','',`<input type="number" step="10" data-ot="qualLower" value="${otNum('qualLower')}">`)}
        ${srow('Qualifying to','',`<input type="number" step="10" data-ot="qualUpper" value="${otNum('qualUpper')}">`)}`:''}
      ${srow('Applies to overtime too','Some schemes only count basic pay.',
        `<input type="checkbox" class="sw" data-ot="penOnOvertime" ${otNum('penOnOvertime')?'checked':''} aria-label="Pension on overtime">`)}
    </div>`;
    if(type!=='none'&&otNum('penPct')){
      h+=`<div class="stats">
        <div class="stat"><div class="k">You put in</div><div class="v">${gbp(bd.pension/12)}</div></div>
        <div class="stat"><div class="k">Costs you</div><div class="v" style="color:var(--warn)">${gbp(cost/12)}</div></div>
        <div class="stat"><div class="k">Goes in total</div><div class="v" style="color:var(--live)">${gbp((bd.pension+bd.employer)/12)}</div></div>
      </div>
      <div class="card"><div class="lab">
        <b>${gbp(bd.pension/12)} a month leaves your pay, but you are only ${gbp(cost/12)} worse off</b>
        <span>Tax relief covers the rest${type==='sacrifice'?', and sacrifice saves National Insurance on top':''}.
        With the employer's ${otNum('penEmployer')}% added, ${gbp((bd.pension+bd.employer)/12)} lands in the pot —
        ${cost>0?(((bd.pension+bd.employer)/cost).toFixed(1)+'× what it costs you'):'at no cost to you'}.</span>
      </div></div>`;
    }
    h+=`<div class="grouphead">Student loan</div>
    <div class="card">
      ${srow('Plan','Comes off overtime too, so it changes what an extra hour is worth.',
        `<select data-ot="slPlan">
          <option value="none" ${ot().slPlan==='none'?'selected':''}>None</option>
          <option value="plan" ${ot().slPlan==='plan'?'selected':''}>Repaying</option></select>`)}
      ${ot().slPlan!=='none'?`
        ${srow('Repay above','Plan 1, 2, 4 and postgraduate all differ — put your threshold in.',`<input type="number" step="10" data-ot="slThresh" value="${otNum('slThresh')}">`)}
        ${srow('Rate %','9% for most plans, 6% for postgraduate.',`<input type="number" step="0.5" data-ot="slPct" value="${otNum('slPct')}">`)}`:''}
    </div>
    <div class="grouphead">Where your ${gbp(g)} goes</div>
    <div class="card">
      ${[['Take-home',bd.take,'var(--live)'],['Income tax',bd.tax,'var(--warn)'],['National Insurance',bd.ni,'var(--warn)'],
         ['Your pension',bd.pension,'var(--calm)'],['Student loan',bd.sl,'var(--warn)']]
        .filter(r=>r[1]>0).map(r=>`
        <div class="bar"><div class="top"><span>${r[0]}<em>${(r[1]/g*100).toFixed(1)}%</em></span><b>${gbp(r[1]/12)}/mo</b></div>
        <div class="track"><i style="width:${r[1]/g*100}%;background:${r[2]}"></i></div></div>`).join('')}
    </div>
    <p class="note">Monthly figures. A pension changes your overtime maths in two ways: it lowers taxable pay, so the higher-rate line moves further away, and if it applies to overtime then part of every extra hour goes into the pot rather than your account.</p>`;
  }

  if(otTab==='back'){
    const bs=backpay().slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    const yr=backpayIn.apply(null,taxYearRange(taxYearOf(todayISO())));
    h+=hintBar('Money owed and paid late — a rise applied from an earlier date, missed overtime, a corrected error. Logged separately because it is not hours, but it is taxed like everything else.')+`
    <div class="stats">
      <div class="stat"><div class="k">This tax year</div><div class="v">${gbp(yr)}</div></div>
      <div class="stat"><div class="k">All time</div><div class="v">${gbp(backpay().reduce((a,b)=>a+(+b.amount||0),0))}</div></div>
      <div class="stat"><div class="k">Entries</div><div class="v">${bs.length}</div></div>
    </div>
    <div class="card">
      <div class="grid">
        <label class="f"><span>Date paid</span><input type="date" id="bpDate" value="${todayISO()}"></label>
        <label class="f"><span>Amount £</span><input type="number" step="0.01" id="bpAmt" placeholder="0"></label>
        <label class="f"><span>What for</span><input type="text" id="bpNote" placeholder="e.g. rise backdated to April"></label>
      </div>
      <div class="row-btns"><button class="btn" id="bpAdd">Add back pay</button></div>
    </div>`;
    const bc=S.bpCalc||(S.bpCalc={from:'',to:'',oldRate:otNum('rate'),newRate:otNum('rate')});
    const oldR=+bc.oldRate||0, newR=+bc.newRate||0, diff=newR-oldR;
    let basicHrs=0, otRows=[], otOwed=0;
    if(bc.from&&bc.to&&bc.to>=bc.from){
      const d1=new Date(bc.from+'T12:00:00'), d2=new Date(bc.to+'T12:00:00');
      const weeks=Math.max(0,(d2-d1)/86400000/7);
      basicHrs=weeks*otNum('contractHours');
      otRows=ot().entries.filter(e=>e.date>=bc.from&&e.date<=bc.to);
      otOwed=otRows.reduce((a,e)=>a+(+e.hours||0)*diff*entryMult(e),0);
    }
    const basicOwed=basicHrs*diff;
    const gross=basicOwed+otOwed;
    h+=`<div class="grouphead">Work out what you are owed</div>
    <div class="card">
      <div class="grid">
        <label class="f"><span>Rise applies from</span><input type="date" value="${esc(bc.from)}" data-bpc="from"></label>
        <label class="f"><span>Up to and including</span><input type="date" value="${esc(bc.to)}" data-bpc="to"></label>
        <label class="f"><span>Old rate £</span><input type="number" step="0.01" value="${bc.oldRate}" data-bpc="oldRate"></label>
        <label class="f"><span>New rate £</span><input type="number" step="0.01" value="${bc.newRate}" data-bpc="newRate"></label>
      </div>
    </div>`;
    if(bc.from&&bc.to&&diff!==0){
      h+=`<div class="counter">
        <div class="cap">Owed before tax</div>
        <div class="big num ${gross>=0?'done':''}">${gbp(gross)}</div>
        <div class="sub"><span>${gbp(diff)} an hour more</span><span>${(basicHrs+otRows.reduce((a,e)=>a+(+e.hours||0),0)).toFixed(1)} hours</span></div>
      </div>
      <div class="card">
        <div class="set-row"><div class="lab"><b>Contracted hours</b>
          <span>${basicHrs.toFixed(1)} hours at ${otNum('contractHours')} a week</span></div>
          <div class="lamt num">${gbp(basicOwed)}</div></div>
        <div class="set-row"><div class="lab"><b>Overtime in that period</b>
          <span>${otRows.length} shift${otRows.length===1?'':'s'}, ${otRows.reduce((a,e)=>a+(+e.hours||0),0)} hours — the uplift applies to the multiplier too</span></div>
          <div class="lamt num">${gbp(otOwed)}</div></div>
        <div class="set-row"><div class="lab"><b>After tax and NI</b>
          <span>At your marginal rate</span></div>
          <div class="lamt num" style="color:var(--live)">${gbp(netOfExtra(otYearGross()+gross)-netOfExtra(otYearGross()))}</div></div>
      </div>
      <div class="row-btns"><button class="btn" id="bpFromCalc">Log ${gbp(gross)} as back pay</button></div>
      <p class="note">Overtime uplift is worked out per shift at its own multiplier, so a ${gbp(diff)} rise is worth ${gbp(diff*1.5)} on a time-and-a-half hour. Check it against the payslip when it arrives.</p>`;
    }
    if(!bs.length) h+=`<div class="empty">Nothing logged.</div>`;
    bs.forEach(b=>{
      h+=`<div class="card">
        <div class="top">
          <input class="name" type="text" value="${esc(b.note||'Back pay')}" data-bp="note" data-id="${b.id}">
          <div class="lamt num">${gbp(b.amount)}</div>
          <button class="del" data-bpdel="${b.id}" aria-label="Delete">×</button>
        </div>
        <div class="grid">
          <label class="f"><span>Date paid</span><input type="date" value="${esc(b.date)}" data-bp="date" data-id="${b.id}"></label>
          <label class="f"><span>Amount £</span><input type="number" step="0.01" value="${b.amount}" data-bp="amount" data-id="${b.id}"></label>
        </div>
      </div>`;
    });
  }

  if(otTab==='hist'){
    const ys=allTaxYears(), sums=ys.map(yearSummary);
    const life=sums.reduce((a,x)=>a+x.total,0);
    const lifeH=sums.reduce((a,x)=>a+x.hours,0);
    h+=`<div class="counter">
      <div class="cap">Earned in overtime, all time</div>
      <div class="big num">${gbp(life)}</div>
      <div class="sub"><span>${lifeH.toFixed(1)} hours</span><span>${sums.reduce((a,x)=>a+x.shifts,0)} shifts</span></div>
    </div>`;
    const max=Math.max(1,...sums.map(x=>x.total));
    h+=`<div class="card">`;
    sums.forEach(x=>{
      h+=`<div class="bar">
        <div class="top"><span>${taxYearLabel(x.year)}<em>${x.hours.toFixed(1)}h${x.backpay?' · incl. '+gbp(x.backpay)+' back pay':''}</em></span><b>${gbp(x.total)}</b></div>
        <div class="track"><i style="width:${x.total/max*100}%;background:var(--brass)"></i></div>
      </div>`;
    });
    h+=`</div>`;
    if(sums.length>1){
      h+=`<div class="plot">`+ (function(){
        const tl=sums.slice().reverse();
        return lineChart(tl.map(x=>({month:x.year+'-04',total:x.total})),
          [{label:'Overtime',get:m=>m.total}]).replace('<div class="plot">','').replace('</div>','');
      })() + `</div>`;
    }
    h+=`<div class="grouphead">Pay rises</div>
    <p class="note">Each rise applies from its date, so older shifts keep the rate you were on at the time. Add the rate you started on first, then every rise since.</p>
    <div class="card">
      ${srow('Rate before the first rise','Used for any shift dated earlier than every rise below.',
        `<input type="number" step="0.01" data-ot="startRate" value="${otNum('startRate')}">`)}
    </div>
    <div class="card">
      <div class="grid">
        <label class="f"><span>Effective from</span><input type="date" id="riseFrom" value="${todayISO()}"></label>
        <label class="f"><span>New hourly rate £</span><input type="number" step="0.01" id="riseRate" value="${otNum('rate')}"></label>
        <label class="f"><span>Note</span><input type="text" id="riseNote" placeholder="e.g. AP status"></label>
      </div>
      <div class="row-btns"><button class="btn" id="riseAdd">Add a rise</button></div>
    </div>`;
    const rs=rises().slice().reverse();
    if(!rs.length) h+=`<div class="empty">No rises recorded — every shift uses your current rate.</div>`;
    rs.forEach((r,i)=>{
      const prev=rs[i+1];
      const pc=prev&&+prev.rate?((+r.rate-+prev.rate)/+prev.rate*100):null;
      h+=`<div class="card">
        <div class="top">
          <input class="name" type="text" value="${esc(r.note||'Pay rise')}" data-rise="note" data-id="${r.id}">
          <div class="lamt num">${gbp(r.rate)}</div>
          <button class="del" data-risedel="${r.id}" aria-label="Delete">×</button>
        </div>
        <div class="lmeta">from ${r.from?new Date(r.from+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'—'}${
          pc!==null?` · <span style="color:${pc>=0?'var(--live)':'var(--warn)'}">${pc>=0?'+':''}${pc.toFixed(1)}%</span>`:''}</div>
        <div class="grid">
          <label class="f"><span>Effective from</span><input type="date" value="${esc(r.from||'')}" data-rise="from" data-id="${r.id}"></label>
          <label class="f"><span>Hourly rate £</span><input type="number" step="0.01" value="${r.rate}" data-rise="rate" data-id="${r.id}"></label>
        </div>
      </div>`;
    });
  }

  if(otTab==='rates'){
    h+=hintBar('Your pay rates first, then the tax bands. Bands are editable because they change — check them each April rather than trusting what I set.')+`
    <div class="card">
      ${srow('Contracted hours a week','Your standard week. Everything else is worked out from this.',
        `<input type="number" step="0.5" data-ot="contractHours" value="${otNum('contractHours')}">`)}
      ${srow('Hourly rate','Change this and the salary follows.',`<input type="number" step="0.01" data-ot="rate" value="${otNum('rate')}">`)}
      ${srow('Annual salary','Change this and the hourly rate follows.',`<input type="number" step="100" data-ot="baseSalary" value="${otNum('baseSalary')}">`)}
      ${srow('Weekday multiplier','Applied Monday to Friday.',`<input type="number" step="0.1" data-ot="mulWeekday" value="${otNum('mulWeekday')}">`)}
      ${srow('Weekend multiplier','Applied Saturday and Sunday.',`<input type="number" step="0.1" data-ot="mulWeekend" value="${otNum('mulWeekend')}">`)}
      ${srow('Weeks in the year','52 unless your contract counts them differently.',
        `<input type="number" step="1" data-ot="weeksPerYear" value="${otNum('weeksPerYear')}">`)}
      ${srow('Overtime is paid','Most employers pay it a month behind. This decides which month the payslip check shows.',
        `<select data-ot="arrears">
          <option value="0" ${otNum('arrears')?'':'selected'}>Same month</option>
          <option value="1" ${otNum('arrears')?'selected':''}>A month later</option></select>`)}
    </div>
    ${(function(){
      const g=otNum('baseSalary'), n=netAnnual(g);
      return `<div class="card">
        <div class="lab"><b>${otNum('contractHours')} hours a week at ${gbp(otNum('rate'))}</b>
        <span>${contractMonthHours().toFixed(1)} hours a month · ${contractYearHours().toFixed(0)} a year</span></div>
        <div class="grid" style="margin-top:10px">
          <div><span class="lmeta">Gross a month</span><div class="lamt num">${gbp(g/12)}</div></div>
          <div><span class="lmeta">Net a month</span><div class="lamt num" style="color:var(--live)">${gbp(n/12)}</div></div>
          <div><span class="lmeta">Gross a year</span><div class="lamt num">${gbp(g)}</div></div>
        </div>
        <div class="note" style="margin-top:10px">Hold that net figure against what actually reaches your account. If they differ, the hourly rate or the contracted hours above is wrong — or something else is coming out of your pay.</div>
      </div>`;
    })()}
    <div class="grouphead">Income tax</div>
    <div class="card">
      ${srow('Personal allowance','Tax-free, tapering away above £100,000.',`<input type="number" step="10" data-ot="pa" value="${otNum('pa')}">`)}
      ${srow('Basic rate up to','',`<input type="number" step="10" data-ot="basicTo" value="${otNum('basicTo')}">`)}
      ${srow('Higher rate up to','',`<input type="number" step="10" data-ot="higherTo" value="${otNum('higherTo')}">`)}
      ${srow('Basic %','',`<input type="number" step="1" data-ot="r1" value="${otNum('r1')}">`)}
      ${srow('Higher %','',`<input type="number" step="1" data-ot="r2" value="${otNum('r2')}">`)}
      ${srow('Additional %','',`<input type="number" step="1" data-ot="r3" value="${otNum('r3')}">`)}
    </div>
    <div class="grouphead">National Insurance</div>
    <div class="card">
      ${srow('Starts at','',`<input type="number" step="10" data-ot="niFrom" value="${otNum('niFrom')}">`)}
      ${srow('Upper limit','',`<input type="number" step="10" data-ot="niTo" value="${otNum('niTo')}">`)}
      ${srow('Main rate %','Between the two figures above.',`<input type="number" step="0.1" data-ot="ni1" value="${otNum('ni1')}">`)}
      ${srow('Upper rate %','Above the upper limit.',`<input type="number" step="0.1" data-ot="ni2" value="${otNum('ni2')}">`)}
    </div>
    <p class="note">Defaults are England, Wales and Northern Ireland. Scotland has its own bands — change the figures above if that applies. Student loan repayments are not modelled; if you have one, expect to keep roughly 9p less in the pound above its threshold.</p>`;
  }
  document.getElementById('tab-ot').innerHTML=h;
}

/* ---------- joint portal ---------- */
let openPlan=null, claimOn=null;
function avatar(m,sz){
  sz=sz||26;
  return `<div style="width:${sz}px;height:${sz}px;border-radius:99px;flex:none;background:${m?m.colour:'#8CA3BA'};
    display:flex;align-items:center;justify-content:center;font-weight:700;color:#0D1A28;font-size:${sz*0.42}px">${initials(m?m.name:'?')}</div>`;
}
function dueLabel(d){
  if(!d) return 'no date set';
  const t=new Date(d+'T12:00:00'), now=new Date();
  const days=Math.round((t-now)/86400000);
  const nice=t.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  if(days<0) return nice+' — overdue';
  if(days===0) return nice+' — today';
  if(days<=14) return nice+' — '+days+' day'+(days===1?'':'s');
  return nice;
}
function renderPlans(){
  if(!isJoint()) return;
  const ps=plans();
  let h='';
  if(openPlan&&planById(openPlan)){
    const p=planById(openPlan), tot=planTotal(p), cl=planClaimed(p), pd=planPaid(p);
    h+=`<button class="lk-alt" style="margin:0 0 12px;text-align:left" id="planBack">‹ All plans</button>
    <div class="counter">
      <div class="cap">Still unclaimed</div>
      <div class="big num ${tot-cl<=0?'done':''}">${gbp(Math.max(0,tot-cl))}</div>
      <div class="meter"><i style="width:${tot?Math.min(100,cl/tot*100):0}%"></i></div>
      <div class="sub"><span>${gbp(cl)} of ${gbp(tot)} spoken for</span><span>${gbp(pd)} actually paid</span></div>
    </div>
    <div class="card">
      <div class="grid">
        <label class="f"><span>Plan name</span><input type="text" data-plan="name" data-id="${p.id}" value="${esc(p.name)}"></label>
        <label class="f"><span>Happening on</span><input type="date" data-plan="targetDate" data-id="${p.id}" value="${esc(p.targetDate||'')}"></label>
      </div>
    </div>
    <div class="grouphead">What it will cost<em>${(p.items||[]).length} items</em></div>`;
    (p.items||[]).forEach(it=>{
      const c=claimed(it), left=(+it.amount||0)-c;
      h+=`<div class="card">
        <div class="top">
          <input class="name" type="text" value="${esc(it.name)}" data-item="name" data-plan-id="${p.id}" data-id="${it.id}">
          <div class="lamt num">${gbp(it.amount)}</div>
          <button class="del" data-itemdel="${p.id}:${it.id}" aria-label="Delete">×</button>
        </div>
        <div class="grid">
          <label class="f"><span>Cost £</span><input type="number" step="1" value="${it.amount}" data-item="amount" data-plan-id="${p.id}" data-id="${it.id}"></label>
          <label class="f"><span>Needed by</span><input type="date" value="${esc(it.dueDate||'')}" data-item="dueDate" data-plan-id="${p.id}" data-id="${it.id}"></label>
        </div>
        <div class="meter" style="margin:10px 0 8px"><i style="width:${(+it.amount)?Math.min(100,c/(+it.amount)*100):0}%"></i></div>`;
      claimsOf(it).forEach(cm=>{
        const m=memberById(cm.memberId);
        h+=`<div class="set-row">
          ${avatar(m)}
          <div class="lab"><b>${esc(m?m.name:'Someone')} — ${gbp(cm.amount)}</b>
            <span>${cm.paid?('paid '+(cm.paidOn?new Date(cm.paidOn).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'')):('by '+dueLabel(cm.by))}</span></div>
          <input type="checkbox" class="tick" data-claimpaid="${p.id}:${it.id}:${cm.id}" ${cm.paid?'checked':''} aria-label="Mark paid">
          <button class="del" data-claimdel="${p.id}:${it.id}:${cm.id}" aria-label="Remove">×</button>
        </div>`;
      });
      if(left>0.005){

/* ---------- hints ----------
   Every explanation sits behind an i, so the pages carry figures and nothing else.
   Ids are derived from the text so an opened hint survives a redraw.
------------------------------------------------------------------------------ */
const openHints=new Set();
function hkey(t){
  let n=0, str=String(t);
  for(let i=0;i<str.length;i++){ n=((n<<5)-n+str.charCodeAt(i))|0; }
  return 'h'+Math.abs(n).toString(36);
}
function iBtn(id){
  return `<button class="ibtn" data-hint="${id}" aria-expanded="${openHints.has(id)}" aria-label="What is this">i</button>`;
}
function iText(id,text,cls){
  return `<div class="${cls||'ihint'} ${openHints.has(id)||st('showHints')?'':'hidden'}" id="${id}">${text}</div>`;
}
/* a right-aligned i for a whole page, with the explanation underneath */
function hintBar(text){
  const id=hkey(text);
  return `<div class="hintbar">${iBtn(id)}</div>${iText(id,text)}`;
}

/* ---------- the budget cycle ----------
   A month here means the stretch your pay has to last, which for most people
   starts on payday rather than the 1st. cycleStart 0 keeps calendar months.
------------------------------------------------------------------------- */
function cycleDay(){ const d=+st('cycleStart')||0; return (d>=1&&d<=31)?d:0; }
function lastDayOf(y,m){ return new Date(y,m+1,0).getDate(); }   // m is 0-indexed
function cycleRange(k){
  const [y,m]=k.split('-').map(Number);
  const d=cycleDay();
  if(!d) return {start:new Date(y,m-1,1), end:new Date(y,m-1,lastDayOf(y,m-1))};
  /* 'covers' — the cycle labelled September is the one your September money lives in,
     so it starts on payday in August. 'starts' — it begins on payday in September. */
  const back=(st('cycleLabel')||'covers')==='covers'?1:0;
  const sM=m-1-back, sY=y;
  const s0=new Date(sY,sM,1);
  const start=new Date(s0.getFullYear(),s0.getMonth(),Math.min(d,lastDayOf(s0.getFullYear(),s0.getMonth())));
  const end=new Date(start); end.setMonth(end.getMonth()+1); end.setDate(end.getDate()-1);
  return {start,end};
}
function cycleDates(k){
  const {start,end}=cycleRange(k), out=[], d=new Date(start);
  while(d<=end){ out.push(new Date(d)); d.setDate(d.getDate()+1); }
  return out;
}
function cycleLabel(k){
  if(!cycleDay()) return '';
  const {start,end}=cycleRange(k);
  const f=x=>x.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return f(start)+' – '+f(end);
}
/* where in the window a "day of the month" actually falls */
function placeInCycle(dayNo,dates){
  const want=Math.min(31,Math.max(1,+dayNo||0));
  let idx=dates.findIndex(x=>x.getDate()===want);
  if(idx>=0) return idx;
  /* that day does not exist in the month it would fall in — use that month's last day */
  for(let i=dates.length-1;i>=0;i--){
    const x=dates[i];
    if(x.getDate()===lastDayOf(x.getFullYear(),x.getMonth())&&want>x.getDate()) return i;
  }
  return -1;
}

/* ---------- cashflow ----------
   Everything with a day of the month laid out across the calendar, then a
   running balance so you can see the low point before it happens.
------------------------------------------------------------------------- */
function ord(d){
  d=+d;
  if(d>=11&&d<=13) return d+'th';
  return d+(['th','st','nd','rd'][d%10]||'th');
}
function daysIn(k){ const [y,m]=k.split('-').map(Number); return new Date(y,m,0).getDate(); }
function firstWeekday(k){ const [y,m]=k.split('-').map(Number); return (new Date(y,m-1,1).getDay()+6)%7; } // Mon=0
function clampDay(d,k){ const n=daysIn(k); return Math.min(Math.max(1,+d||0),n); }
function calCfg(){ if(!S.cal) S.cal={openingFrom:'',opening:0}; return S.cal; }
function openingBalance(){
  const c=calCfg();
  if(c.openingFrom){ const a=accounts().find(x=>x.id===c.openingFrom); if(a) return accBalance(a); }
  return +c.opening||0;
}
/* every movement in the month, dated where we know the day */
function schedule(k){
  const out=[];
  INC().forEach(i=>{
    const amt=+i.amount||0; if(amt<=0) return;
    out.push({day:i.day?clampDay(i.day,k):null,name:i.name,amount:amt,dir:'in',kind:'Income',src:'income',id:i.id});
  });
  ITEMS().forEach(i=>{
    const amt=amountOf(i); if(amt<=0) return;
    out.push({day:i.day?clampDay(i.day,k):null,name:i.name,amount:amt,dir:'out',
      kind:i.method==='dd'?'Direct debit':i.group,pot:i.pot,src:'item',id:i.id,fixed:i.method==='dd'});
  });
  S.debts.forEach(d=>{
    const amt=amountOf(d); if(amt<=0) return;
    out.push({day:d.day?clampDay(d.day,k):null,name:d.name,amount:amt,dir:'out',
      kind:d.method==='dd'?'Direct debit':'Debt',src:'debt',id:d.id,fixed:d.method==='dd',apr:+d.apr||0});
  });
  oneoffsFor(k).forEach(o=>{
    const amt=+o.amount||0; if(amt<=0) return;
    out.push({day:o.day?clampDay(o.day,k):null,name:o.name,amount:amt,dir:'out',kind:'One-off',src:'oneoff',id:o.id});
  });
  return out;
}
function dayTotals(k){
  const dates=cycleDates(k), rows=schedule(k);
  const days=dates.map(d=>({date:d,in:0,out:0,items:[]}));
  const undated={in:0,out:0,items:[]};
  rows.forEach(r=>{
    if(!r.day){ undated[r.dir]+=r.amount; undated.items.push(r); return; }
    const i=placeInCycle(r.day,dates);
    if(i<0){ undated[r.dir]+=r.amount; undated.items.push(r); return; }
    days[i][r.dir]+=r.amount; days[i].items.push(r);
  });
  return {days,undated,dates,n:dates.length};
}
function runningBalance(k){
  const {days}=dayTotals(k);
  let bal=openingBalance();
  const line=days.map(d=>{ bal+=d.in-d.out; return {date:d.date,bal:bal}; });
  const low=line.reduce((a,x)=>x.bal<a.bal?x:a,line[0]||{date:new Date(),bal:bal});
  return {line,low,end:bal};
}

/* ---------- holdings ----------
   A value per platform, recorded monthly. Contributions are tracked separately
   from movement, so growth is real growth rather than money you paid in.
------------------------------------------------------------------------------ */
const PLATFORMS=['Robinhood','eToro','Premium Bonds','Pension','Trading 212','Vanguard','Loqbox','Cash ISA','Other'];
const HOLD_KINDS=['Shares','Funds','Crypto','Bonds','Pension','Cash','Property','Other'];
function holdings(){ if(!S.holdings) S.holdings=[]; return S.holdings; }
function hist(hd){ if(!hd.history) hd.history=[]; return hd.history.slice().sort((a,b)=>a.month.localeCompare(b.month)); }
function entryAt(hd,k){ return hist(hd).find(e=>e.month===k)||null; }
function latestOn(hd,k){
  const rows=hist(hd).filter(e=>!k||e.month<=k);
  return rows.length?rows[rows.length-1]:null;
}
function holdValue(hd,k){ const e=latestOn(hd,k); return e?(+e.value||0):(+hd.value||0); }
function prevValue(hd,k){
  const rows=hist(hd).filter(e=>e.month<k);
  return rows.length?(+rows[rows.length-1].value||0):0;
}
/* if no starting figure was given, the first value recorded is the baseline —
   otherwise everything you already held would be counted as growth */
function impliedOpening(hd){
  if((+hd.opening||0)>0) return +hd.opening;
  const rows=hist(hd);
  if(!rows.length) return 0;
  return Math.max(0,(+rows[0].value||0)-(+rows[0].added||0));
}
function holdContributed(hd){ return impliedOpening(hd)+hist(hd).reduce((a,e)=>a+(+e.added||0),0); }
function holdGrowth(hd){ return holdValue(hd)-holdContributed(hd); }
function monthMove(hd,k){
  const e=entryAt(hd,k); if(!e) return null;
  return (+e.value||0)-prevValue(hd,k)-(+e.added||0);
}
function holdingsTotal(k){ return holdings().reduce((a,h)=>a+holdValue(h,k),0); }
function holdingsContributed(){ return holdings().reduce((a,h)=>a+holdContributed(h),0); }
function netWorth(k){ return holdingsTotal(k)+accountsPositive()-debtsTotal(); }
function holdMonths(){
  const set=new Set();
  holdings().forEach(h=>hist(h).forEach(e=>set.add(e.month)));
  return [...set].sort();
}
function byGroup(field){
  const g={};
  holdings().forEach(h=>{ const k=h[field]||'Other'; g[k]=(g[k]||0)+holdValue(h); });
  return Object.entries(g).sort((a,b)=>b[1]-a[1]);
}
/* what the plan says you put into this platform each month */
function plannedFor(name){
  const it=ITEMS().find(i=>i.group==='Savings & investments'&&
    String(i.name).toLowerCase().includes(String(name).toLowerCase().split(' ')[0]));
  return it?amountOf(it):0;
}

/* ---------- pull down to sync ----------
   The browser's own pull-to-refresh is switched off by overscroll-behavior,
   so this replaces it with something that actually syncs rather than reloads.
------------------------------------------------------------------------- */
const PT_TRIGGER=72, PT_MAX=110;
let ptY=null, ptX=0, ptD=0, ptBusy=false;
function ptrEl(){ return document.getElementById('ptr'); }
function ptrSet(dist,armed){
  const el=ptrEl(); if(!el) return;
  el.classList.add('drag');
  el.classList.toggle('armed',!!armed);
  const d=Math.min(dist,PT_MAX);
  el.style.transform=`translate(-50%,${Math.max(-52,d-46)}px) rotate(${d*3}deg)`;
  el.style.opacity=Math.min(1,dist/48);
}
function ptrReset(){
  const el=ptrEl(); if(!el) return;
  el.classList.remove('drag','armed');
  el.style.transform=''; el.style.opacity='';
}
function ptrBusy(on){
  const el=ptrEl(); if(!el) return;
  el.classList.remove('drag','armed');
  el.style.transform=''; el.style.opacity='';
  el.classList.toggle('busy',on);
}
async function pullAction(){
  if(ptBusy) return;
  ptBusy=true; ptrBusy(true);
  const here=view, scrolled=window.scrollY||0;
  try{
    if(sync().enabled&&sync().token){
      await syncNow(true);
      if(S&&view!==here){ view=here; renderAll(); }      // stay on the page you were reading
      if(S) setTimeout(()=>window.scrollTo(0,scrolled),0);
      if(syncState!=='fail') toast('Up to date');
    }else{
      potList(); view=here; renderAll();
      setTimeout(()=>window.scrollTo(0,scrolled),0);
      toast('Refreshed — sync is off, set it up under Settings');
    }
  }catch(e){ toast('Could not sync'); }
  setTimeout(()=>{ ptrBusy(false); ptBusy=false; },450);
}
document.addEventListener('touchstart',e=>{
  if(!S||ptBusy||!st('pullSync')) return;
  if(e.touches.length!==1) return;
  if((window.scrollY||window.pageYOffset||0)>2) return;
  const tgt=e.target;
  if(tgt&&tgt.closest&&(tgt.closest('textarea')||tgt.closest('.modal')||tgt.closest('.sheet-more')||tgt.closest('.lockscreen'))) return;
  ptY=e.touches[0].clientY; ptX=e.touches[0].clientX; ptD=0;
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(ptY===null) return;
  const dy=e.touches[0].clientY-ptY, dx=Math.abs(e.touches[0].clientX-ptX);
  if(dy<=0||dx>Math.abs(dy)*0.8){ ptD=0; ptrReset(); return; }   // sideways, or scrolling up
  if((window.scrollY||window.pageYOffset||0)>2){ ptD=0; ptrReset(); return; }
  ptD=dy*0.55;                                                    // a bit of resistance
  ptrSet(ptD,ptD>=PT_TRIGGER);
},{passive:true});
['touchend','touchcancel'].forEach(ev=>document.addEventListener(ev,()=>{
  if(ptY===null) return;
  const fire=ptD>=PT_TRIGGER;
  ptY=null; ptD=0;
  if(fire) pullAction(); else ptrReset();
},{passive:true}));

/* ---------- alerts ---------- */
function alerts(){
  const out=[]; if(!S||isJoint()) return out;
  const add=(level,title,detail,tab)=>out.push({level,title,detail,tab});
  const k=S.current, rec=mrec(k), r=buildRun();
  if(r.remaining>0.005) add('warn','Payday run unfinished',gbp(r.remaining)+' still to move across.','run');
  if(r.living<0) add('bad','Short this month','Allocations exceed income by '+gbp(Math.abs(r.living))+'.','run');
  const floor=+st('livingFloor')||0;
  if(floor>0&&r.living>=0&&r.living<floor) add('warn','Living money below your floor',gbp(floor-r.living)+' under.','run');
  S.debts.forEach(d=>{
    const p=amountOf(d), int=(+d.balance||0)*(+d.apr||0)/100/12;
    if(p>0&&p<int) add('bad',d.name+' is going backwards','The payment is less than the interest.','debt');
  });
  accounts().forEach(a=>{
    const used=odUsed(a), lim=odLimit(a);
    if(lim>0&&used>lim) add('bad',a.name+' is over its overdraft',gbp(used-lim)+' beyond the limit.','acc');
    else if(lim>0&&used>lim*0.8) add('warn',a.name+' is near its overdraft limit',gbp(odHeadroom(a))+' left.','acc');
  });
  (S.events||[]).forEach(e=>{
    const n=monthsUntil(e.dueMonth);
    if(n<0&&(+e.saved||0)<(+e.target||0)) add('warn',e.name+' has passed its date',gbp((+e.target||0)-(+e.saved||0))+' short.','events');
    else if(n===0) add('warn',e.name+' is due this month',gbp(e.saved)+' of '+gbp(e.target)+' put by.','events');
  });
  const oo=oneoffsFor(k);
  if(oo.length&&!rec.ticks['oneoff:'+k]) add('info',oo.length+' one-off'+(oo.length===1?'':'s')+' this month',gbp(oo.reduce((a,b)=>a+(+b.amount||0),0))+' to move.','out');
  const prev=shiftMonth(k,-1);
  if(S.months[prev]&&!S.months[prev].closed) add('info',monthName(prev)+' was never closed','Close it to file the record and roll balances.','close');
  const t=nextThreshold();
  if(t){ const left=Math.max(0,t.gap-otYearGross());
    if(left<2000) add('info','Close to the '+t.name,gbp(left)+' of headroom left this tax year.','ot'); }
  const rbA=runningBalance(k);
  if(rbA.low.bal<0) add('bad','You run short on '+rbA.low.date.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+
    ' — '+advice(k).length+' suggestions ready',
    gbp(Math.abs(rbA.low.bal))+' short before the next money lands.','cal');
  if(holdings().length){
    const missing=holdings().filter(hd=>!entryAt(hd,k)).length;
    if(missing) add('info',missing+' holding'+(missing===1?'':'s')+' not updated this month','Values for '+monthName(k)+' are still blank.','inv');
  }
  if(syncState==='fail') add('bad','Sync is failing',syncMsg||'Check the token under Settings.','set');
  const lb=(S.meta||{}).lastBackup;
  if(!lb) add('warn','No backup taken yet','One tap under Settings → Data.','set');
  else if((Date.now()-new Date(lb))/86400000>45) add('warn','Backup is over six weeks old','Worth doing before you change anything big.','set');
  if(!out.length) add('ok','Nothing needs you','Everything is where it should be.','run');
  return out;
}

/* ---------- bulk import ----------
   Paste straight out of Excel — tabs, commas or semicolons all parse.
   Deliberately forgiving about column order and header wording.
--------------------------------------------------------------------- */
function splitRows(text){
  return String(text||'').split(/\r?\n/).map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim())
    .map(l=>{
      const d = l.indexOf('\t')>=0 ? '\t' : (l.indexOf(';')>=0 ? ';' : ',');
      const cells=[]; let cur='', q=false;
      for(let i=0;i<l.length;i++){
        const ch=l[i];
        if(ch==='"'){ if(q&&l[i+1]==='"'){ cur+='"'; i++; } else q=!q; continue; }
        if(ch===d&&!q){ cells.push(cur); cur=''; continue; }   // separators inside quotes are data
        cur+=ch;
      }
      cells.push(cur);
      return cells.map(c=>c.trim());
    });
}
function num(v){
  const n=parseFloat(String(v||'').replace(/[£$€,\s]/g,''));
  return isFinite(n)?n:0;
}
function parseMonth(v){
  const t=String(v||'').trim();
  let m=t.match(/^(\d{4})[-\/](\d{1,2})/);                      // 2026-03
  if(m) return m[1]+'-'+String(+m[2]).padStart(2,'0');
  m=t.match(/^(\d{1,2})[-\/](\d{4})$/);                          // 03/2026
  if(m) return m[2]+'-'+String(+m[1]).padStart(2,'0');
  const names=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const low=t.toLowerCase();
  const mi=names.findIndex(n=>low.startsWith(n)||low.includes(' '+n));
  const ym=t.match(/(19|20)\d{2}/);
  if(mi>=0&&ym) return ym[0]+'-'+String(mi+1).padStart(2,'0');
  return null;                                  // anything else is not a month
}
function parseDate(v){
  const t=String(v||'').trim();
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
  m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);        // UK or US, disambiguated below
  if(m){
    let a=+m[1], b=+m[2], y=+m[3]; if(y<100) y+=2000;
    let day=a, mon=b;
    if(a<=12&&b>12){ mon=a; day=b; }                             // clearly US
    return y+'-'+String(mon).padStart(2,'0')+'-'+String(day).padStart(2,'0');
  }
  const d=new Date(t);
  return isNaN(d)?null:d.toISOString().slice(0,10);
}
function headerIndex(cells,names){
  const low=cells.map(c=>String(c).toLowerCase());
  for(const n of names){ const i=low.findIndex(c=>c.includes(n)); if(i>=0) return i; }
  return -1;
}
function parseMonthly(text){
  const rows=splitRows(text); if(!rows.length) return {rows:[],errors:['Nothing pasted.']};
  let start=0, ix={month:0,income:1,out:2,saved:3,debt:4};
  const head=rows[0].map(c=>String(c).toLowerCase());
  if(head.some(c=>/month|date|period/.test(c))){
    ix={ month:headerIndex(rows[0],['month','date','period']),
         income:headerIndex(rows[0],['income','in','gross','wage','pay']),
         out:headerIndex(rows[0],['out','expense','spend','allocated','total']),
         saved:headerIndex(rows[0],['saved','saving','invest']),
         debt:headerIndex(rows[0],['debt','owed','balance']) };
    start=1;
  }
  const out=[], errors=[];
  for(let i=start;i<rows.length;i++){
    const c=rows[i];
    const mk=parseMonth(c[ix.month]);
    if(!mk){ errors.push('Row '+(i+1)+': could not read the month from "'+(c[ix.month]||'')+'"'); continue; }
    const inc=num(c[ix.income]), og=num(c[ix.out]);
    if(!inc&&!og){ errors.push('Row '+(i+1)+': no income or outgoings figure'); continue; }
    out.push({ month:mk,
      income:inc, out:og,
      saved:ix.saved>=0?num(c[ix.saved]):0,
      debt:ix.debt>=0?num(c[ix.debt]):0, living:0, pots:{} });
  }
  out.forEach(r=>{ r.living=r.income-r.out; if(r.out) r.pots={'Imported':r.out}; });
  return {rows:out,errors};
}
function parseShifts(text){
  const rows=splitRows(text); if(!rows.length) return {rows:[],errors:['Nothing pasted.']};
  let start=0, ix={date:0,rate:1,hours:2,total:3};
  if(rows[0].some(c=>/date/i.test(c))){
    ix={ date:headerIndex(rows[0],['date']),
         rate:headerIndex(rows[0],['type','rate','multip']),
         hours:headerIndex(rows[0],['length','hour','hrs']),
         total:headerIndex(rows[0],['total','made','pay','amount']) };
    start=1;
  }
  const out=[], errors=[];
  for(let i=start;i<rows.length;i++){
    const c=rows[i];
    const d=parseDate(c[ix.date]);
    const hrs=ix.hours>=0?num(c[ix.hours]):0;
    if(!d||!(hrs>0)) continue;                       // silently skip the blank template rows
    const rawRate=ix.rate>=0?num(c[ix.rate]):0;
    const tot=ix.total>=0?num(c[ix.total]):0;
    let rate=rawRate>0?rawRate:(tot>0?+(tot/hrs).toFixed(4):0);   // the rate actually paid
    const base=rateOn(d)||otNum('rate');
    const mult=(rate>0&&base>0)?+(rate/base).toFixed(3):null;
    out.push({date:d,hours:hrs,rate:rate||null,mult:mult,shown:tot});
  }
  if(!out.length) errors.push('No rows had both a date and hours.');
  return {rows:out,errors};
}
let importKind='monthly', importPreview=null;
function runImportPreview(){
  const text=(document.getElementById('impText')||{}).value||'';
  importPreview = importKind==='monthly'?parseMonthly(text):parseShifts(text);
  renderSet();
}
function applyImport(){
  if(!importPreview||!importPreview.rows.length){ toast('Nothing to import'); return; }
  if(importKind==='monthly'){
    const byMonth={}; (S.history||[]).forEach(x=>byMonth[x.month]=x);
    importPreview.rows.forEach(r=>{ byMonth[r.month]=Object.assign({},byMonth[r.month]||{},r); });
    S.history=Object.values(byMonth).sort((a,b)=>a.month.localeCompare(b.month));
    toast(importPreview.rows.length+' months imported');
  }else{
    importPreview.rows.forEach(r=>ot().entries.push({id:uid(),date:r.date,hours:r.hours,mult:r.mult,rate:r.rate||null}));
    toast(importPreview.rows.length+' shifts imported');
  }
  importPreview=null; save(); renderAll();
}

         ['Debts',-debtsTotal(),'var(--warn)']].map(r=>{
        const mag=Math.max(holdingsTotal(),accountsPositive(),debtsTotal(),1);
        return `<div class="bar"><div class="top"><span>${r[0]}</span><b style="color:${r[2]}">${r[1]<0?'−':''}${gbp(Math.abs(r[1]))}</b></div>
          <div class="track"><i style="width:${Math.abs(r[1])/mag*100}%;background:${r[2]}"></i></div></div>`;
      }).join('')}
    </div>`;
    if(months.length>1){
      const series=months.map(m=>({month:m, nw:holdings().reduce((a,hd)=>a+holdValue(hd,m),0)}));
      h+=`<div class="grouphead">Investments over time</div>`+
        lineChart(series,[{label:'Held',get:x=>x.nw}]);
      const first=series[0].nw, last=series[series.length-1].nw;
      const added=holdings().reduce((a,hd)=>a+hist(hd).filter(e=>e.month>months[0]).reduce((x,e)=>x+(+e.added||0),0),0);
      const realGain=last-first-added;
      h+=`<div class="card"><div class="lab">
        <b style="color:${realGain>=0?'var(--live)':'var(--warn)'}">${realGain>=0?'+':''}${gbp(realGain)} of actual growth since ${monthName(months[0])}</b>
        <span>Value rose ${gbp(last-first)}, of which ${gbp(added)} was money you paid in. The rest is the market.</span>
      </div></div>`;
    } else {
      h+=`<div class="empty">Record two months and the trend appears here.</div>`;
    }
  }
  document.getElementById('tab-inv').innerHTML=h;
}

/* ---------- today ----------
   How much is genuinely free to spend between now and the next money in,
   after everything already committed in that window.
------------------------------------------------------------------------- */
function todayPicture(k){
  const {days}=dayTotals(k), rb=runningBalance(k);
  const now=new Date(); now.setHours(12,0,0,0);
  let i=days.findIndex(d=>d.date.toDateString()===now.toDateString());
  const inCycle=i>=0;
  if(!inCycle) i=0;
  const balNow=rb.line[i]?rb.line[i].bal:openingBalance();
  /* the next day money arrives */
  let nextIn=-1;
  for(let j=i+1;j<days.length;j++){ if(days[j].in>0){ nextIn=j; break; } }
  const horizon=nextIn>=0?nextIn:days.length-1;
  let committed=0;
  for(let j=i+1;j<=horizon;j++) committed+=days[j].out;
  const floor=+st('livingFloor')||0;
  const daysLeft=Math.max(1,horizon-i);
  const free=balNow-committed;
  return {
    inCycle, i, date:days[i]?days[i].date:now, balNow, committed, free,
    perDay:free/daysLeft, daysLeft, nextIn:nextIn>=0?days[nextIn]:null,
    today:days[i]||{in:0,out:0,items:[]},
    upcoming:days.slice(i+1,i+8).filter(d=>d.in>0||d.out>0),
    floor
  };
}
/* ---------- what if ----------
   Re-runs the same forecast with your changes layered on top. Nothing is saved
   until you say so, so you can push it around freely.
------------------------------------------------------------------------- */
function scenarioCfg(){
  if(!S.scen) S.scen={cost:0,costDay:0,otHours:0,biz:0,extraDebt:0,cutPct:0};
  return S.scen;
}
function scenarioRun(k){
  const c=scenarioCfg(), dates=cycleDates(k), rows=schedule(k).filter(r=>r.day);
  const per=dates.map(()=>({in:0,out:0}));
  rows.forEach(r=>{
    const i=placeInCycle(r.day,dates); if(i<0) return;
    let amt=r.amount;
    if(r.dir==='out'&&(+c.cutPct||0)>0&&!r.fixed&&r.src==='item') amt=amt*(1-(+c.cutPct)/100);
    per[i][r.dir]+=amt;
  });
  if((+c.cost||0)>0){
    const i=placeInCycle(+c.costDay||dates[0].getDate(),dates);
    if(i>=0) per[i].out+=(+c.cost);
  }
  if((+c.extraDebt||0)>0){
    const i=Math.max(0,dates.length-1);
    per[i].out+=(+c.extraDebt);
  }
  const otGrossX=(+c.otHours||0)*otNum('rate')*otNum('mulWeekday');
  const otNet=otGrossX>0?(netOfExtra(otYearGross()+otGrossX)-netOfExtra(otYearGross())):0;
  if(otNet>0){ const i=Math.max(0,dates.length-1); per[i].in+=otNet; }
  if((+c.biz||0)>0){
    const weekly=+c.biz, n=Math.floor(dates.length/7);
    for(let w=1;w<=n;w++){ const i=Math.min(dates.length-1,w*7); per[i].in+=weekly; }
  }
  let bal=openingBalance(), low={bal:Infinity,i:0};
  const line=per.map((d,i)=>{ bal+=d.in-d.out; if(bal<low.bal) low={bal:bal,i:i}; return {date:dates[i],bal:bal}; });
  return {line,low:{bal:low.bal,date:dates[low.i]},end:bal,otNet:otNet,otGross:otGrossX};
}

/* ---------- advisor ----------
   Rules, not a chatbot. Every figure below is worked out from your own data and
   can be checked by hand — nothing is guessed and nothing leaves the device.
------------------------------------------------------------------------------ */
function weeksLeftIn(k){
  const {end}=cycleRange(k), now=new Date();
  const days=Math.max(1,Math.ceil((end-now)/86400000));
  return Math.max(0.5,days/7);
}
/* what happens to the low point if one payment moves to a different date */
function simulateMove(k,row,newDay){
  const dates=cycleDates(k), rows=schedule(k);
  const idxNew=placeInCycle(newDay,dates);
  if(idxNew<0) return null;
  let bal=openingBalance(), low={bal:Infinity,i:0};
  const per=dates.map(()=>({in:0,out:0}));
  rows.forEach(r=>{
    let i;
    if(r.src===row.src&&r.id===row.id) i=idxNew;
    else if(r.day) i=placeInCycle(r.day,dates);
    else return;
    if(i<0) return;
    per[i][r.dir]+=r.amount;
  });
  per.forEach((d,i)=>{ bal+=d.in-d.out; if(bal<low.bal) low={bal:bal,i:i}; });
  return {low:low.bal,date:dates[low.i],end:bal};
}
function advice(k){
  const out=[], rb=runningBalance(k), dates=cycleDates(k);
  const shortfall=rb.low.bal<0?Math.abs(rb.low.bal):0;
  const rows=schedule(k).filter(r=>r.day);
  const lowIdx=dates.findIndex(d=>d.toDateString()===rb.low.date.toDateString());

  if(shortfall>0){
    /* 1. move something that is not a direct debit to after the dip */
    const movable=rows.filter(r=>r.dir==='out'&&!r.fixed&&placeInCycle(r.day,dates)<=lowIdx);
    let best=null;
    movable.forEach(r=>{
      for(let i=lowIdx+1;i<dates.length;i++){
        const sim=simulateMove(k,r,dates[i].getDate());
        if(!sim) continue;
        if(sim.low<=rb.low.bal+0.01) continue;                 // no better than now
        const cand={row:r,to:dates[i],sim:sim};
        if(!best) { best=cand; continue; }
        const fixes=sim.low>=0, bestFixes=best.sim.low>=0;
        if(fixes&&!bestFixes) best=cand;                        // a full fix always wins
        else if(fixes===bestFixes){
          if(r.amount<best.row.amount-0.01) best=cand;          // then the smallest disruption
          else if(!fixes&&sim.low>best.sim.low+0.01) best=cand; // otherwise whichever helps most
        }
        if(fixes) break;                                        // no need to push it later still
      }
    });
    if(best){
      out.push({level:best.sim.low>=0?'fix':'part',
        t:'Move '+best.row.name+' to the '+ord(best.to.getDate()),
        b:(best.sim.low>=0
          ? 'That alone clears the shortfall — the lowest point becomes '+gbp(best.sim.low)+'. '
          : 'That lifts the low point to '+gbp(best.sim.low)+', which helps but does not fix it on its own. ')+
          'It is a transfer rather than a direct debit, so the date is yours to choose.',
        act:{kind:'move',src:best.row.src,id:best.row.id,day:best.to.getDate(),
             label:'Move it to the '+ord(best.to.getDate())}});
    }
    /* 2. split a card payment across two cycles */
    const card=rows.filter(r=>r.src==='debt'&&!r.fixed&&placeInCycle(r.day,dates)<=lowIdx&&
        r.amount>shortfall+20)                                   // must leave a sensible payment behind
      .sort((a,b)=>(b.apr||0)-(a.apr||0))[0];
    if(card){
      const half=Math.min(Math.ceil(shortfall/5)*5, card.amount-20);
      out.push({level:'idea',
        t:'Pay '+gbp(card.amount-half)+' to '+card.name+' this cycle instead of '+gbp(card.amount),
        b:'Holding back '+gbp(half)+' covers the gap and still leaves '+gbp(card.amount-half)+' going onto the card. At '+(card.apr||0).toFixed(1)+'% that costs about '+
          gbp(half*(card.apr||0)/100/12)+' in extra interest for the month — cheap next to an unarranged overdraft, '+
          'but only worth doing if you put the full amount back next cycle.'});
    }
    /* 3. earn the difference */
    const perHour=otNum('rate')*otNum('mulWeekday');
    const grossNeed=grossForNet(shortfall);
    const hrs=perHour>0?grossNeed/perHour:0;
    const wks=weeksLeftIn(k);
    out.push({level:'earn',t:Math.ceil(hrs)+' hours of overtime would cover it',
      b:gbp(shortfall)+' after tax needs '+gbp(grossNeed)+' gross at your marginal rate. At '+gbp(perHour)+
        ' an hour that is '+hrs.toFixed(1)+' hours, or about '+(hrs/wks).toFixed(1)+' a week for the '+
        wks.toFixed(1)+' weeks left in this cycle.'});
    const biz=shortfall/wks;
    out.push({level:'earn',t:gbp(biz)+' a week from Bindis Blueprints would do the same',
      b:'Business income is not taxed at source, so the figure is the shortfall spread across what is left of the cycle. Treat it as the floor, not the target.'});
  }

  /* 4. the standing trade-off: interest paid against interest earned */
  const worst=S.debts.slice().sort((a,b)=>(+b.apr||0)-(+a.apr||0))[0];
  const bestSaver=accounts().filter(a=>+a.rate>0&&accBalance(a)>0).sort((a,b)=>(+b.rate)-(+a.rate))[0];
  if(worst&&bestSaver&&(+worst.apr||0)>(+bestSaver.rate||0)+1){
    const spare=Math.max(0,accBalance(bestSaver)-1000);
    if(spare>100){
      const gain=spare*((+worst.apr)-(+bestSaver.rate))/100;
      out.push({level:'idea',t:'Every £100 sat in '+bestSaver.name+' is costing you money',
        b:bestSaver.name+' pays '+(+bestSaver.rate).toFixed(2)+'% while '+worst.name+' charges '+(+worst.apr).toFixed(1)+'%. '+
          'Putting '+gbp(spare)+' of it against '+worst.name+' would save about '+gbp(gain)+' a year. '+
          'Keeping some back for emergencies is a fair reason not to — just make it a decision rather than a default.'});
    }
  }
  /* 5. a payment that never gets anywhere */
  S.debts.forEach(d=>{
    const p2=amountOf(d), int=(+d.balance||0)*(+d.apr||0)/100/12;
    if(p2>0&&p2<int){
      const need=Math.ceil((int-p2)/5)*5;
      out.push({level:'fix',t:d.name+' needs at least '+gbp(need)+' more a month',
        b:'You are paying '+gbp(p2)+' against '+gbp(int)+' of interest, so the balance grows every month however faithfully you pay. '+
          'Anything above '+gbp(int)+' starts actually clearing it.'});
    }
  });
  /* 6. where a surplus should go */
  const r2=buildRun();
  if(shortfall===0&&r2.living>(+st('livingFloor')||0)+100){
    const spare=r2.living-(+st('livingFloor')||0);
    if(worst&&(+worst.apr||0)>0){
      const months=Math.ceil((+worst.balance||0)/Math.max(1,amountOf(worst)+spare*0.5));
      out.push({level:'idea',t:'You have '+gbp(spare)+' spare this cycle',
        b:'Half of it onto '+worst.name+' at '+(+worst.apr).toFixed(1)+'% would clear that card in roughly '+months+
          ' months rather than letting it run. The other half keeps the savings habit going, which matters more than the maths when a bad month arrives.'});
    }
  }
  return out;
}

function short(n){
  const a=Math.abs(n);
  if(a>=1000) return (n<0?'-':'')+'£'+(a/1000).toFixed(a>=10000?0:1)+'k';
  return (n<0?'-':'')+'£'+Math.round(a);
}

    <div class="sub"><span>${gbp(t.balNow)} in hand</span><span>${gbp(t.committed)} already spoken for</span></div>
  </div>`;

          <span><span class="chip ${r.kind==='Direct debit'?'dd':''}">${esc(r.kind)}</span></span></div>
        <div class="lamt num" style="color:${r.dir==='in'?'var(--live)':'var(--warn)'}">${r.dir==='in'?'+':'−'}${gbp(r.amount)}</div>
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`<div class="grouphead">Next seven days<em>${t.upcoming.length} day${t.upcoming.length===1?'':'s'}</em></div>`;
  if(!t.upcoming.length) h+=`<div class="empty">Nothing due in the next week.</div>`;

      </div>`;
    });
    h+=`</div>`;
  }
  return h;
}
function renderWhatIf(k){

  const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});

  h+=`<div class="stats">

    <div class="stat"><div class="k">Difference</div><div class="v" style="color:${dLow>=0?'var(--live)':'var(--warn)'}">${dLow>=0?'+':''}${gbp(dLow)}</div></div>

      <label class="f"><span>Trim flexible spending %</span><input type="number" min="0" max="90" step="5" value="${c.cutPct||0}" data-scen="cutPct"></label>
    </div>
  </div>
  <div class="grouphead">Earning more</div>
  <div class="card">
    <div class="grid">
      <label class="f"><span>Overtime hours</span><input type="number" step="1" value="${c.otHours||0}" data-scen="otHours"></label>
      <label class="f"><span>Business, a week £</span><input type="number" step="25" value="${c.biz||0}" data-scen="biz"></label>
      <label class="f"><span>Extra onto debt £</span><input type="number" step="25" value="${c.extraDebt||0}" data-scen="extraDebt"></label>
    </div>
    ${(+c.otHours||0)>0?`<div class="note">${c.otHours} hours at ${gbp(otNum('rate')*otNum('mulWeekday'))} is ${gbp(sim.otGross)} gross, ${gbp(sim.otNet)} after tax and NI.</div>`:''}
  </div>`;
  if((+c.extraDebt||0)>0){
    const worst=S.debts.slice().sort((a,b)=>(+b.apr||0)-(+a.apr||0))[0];
    if(worst){
      const base2=amountOf(worst), int=(+worst.balance||0)*(+worst.apr||0)/100/12;
      const now=base2>int?Math.ceil((+worst.balance||0)/(base2-int)):Infinity;
      const then=(base2+(+c.extraDebt))>int?Math.ceil((+worst.balance||0)/(base2+(+c.extraDebt)-int)):Infinity;
      h+=`<div class="card"><div class="lab">
        <b>${esc(worst.name)} clears in ${isFinite(then)?then+' months':'never at this rate'}</b>
        <span>${isFinite(now)?'Instead of '+now+' months':'It currently never clears'} — ${isFinite(now)&&isFinite(then)?(now-then)+' months sooner':'that alone turns it around'}.</span>
      </div></div>`;
    }
  }
  h+=`<div class="row-btns">
    <button class="btn ghost" id="scenReset">Clear it</button>
  </div>
  <p class="note">The overtime and business figures land late in the cycle, which is the cautious way round — money you have not earned yet should not prop up the early weeks.</p>`;
  return h;
}

  if(setTab==='imp'){

/* ---------- render: CLOSE MONTH ---------- */
function renderClose(){
  const rec=mrec(S.current);
  let h=`<p class="note">Month end: open each account and type in the real balance. <b style="color:var(--live)">A plus means you cleared more than planned</b> — overpayment, or less interest than expected. <b style="color:var(--warn)">A minus means less went off it</b>: a missed payment, extra spending on the card, or more interest than assumed.</p>`;
  S.debts.forEach(d=>{
    const p=amountOf(d), int=(+d.balance||0)*(+d.apr||0)/100/12;
    const expected=Math.max(0,(+d.balance||0)+int-p);
    const actual=rec.actuals[d.id];
    const has=actual!==undefined&&actual!==null&&actual!=='';
    const ahead=has?(expected-(+actual)):0;      // + = more cleared than planned
    h+=`<div class="rec">
      <div class="hdr"><b>${esc(d.name)}</b><span class="note">${(+d.apr||0).toFixed(1)}% APR</span></div>
      <div class="recgrid">
        <div><span>Opened at</span><b>${gbp(d.balance)}</b></div>
        <div><span>Paid</span><b>−${gbp(p)}</b></div>
        <div><span>Interest</span><b>+${gbp(int)}</b></div>
        <div><span>Should be</span><b>${gbp(expected)}</b></div>
        <div><label class="f"><span>Actually is £</span>
          <input type="number" step="0.01" value="${has?actual:''}" placeholder="—" data-actual="${d.id}"></label></div>
        <div><span>Ahead of plan</span><b class="${!has?'':(ahead>0.5?'var-ok':ahead<-0.5?'var-bad':'')}">${has?(ahead>0?'+':'')+gbp(ahead):'—'}</b></div>
      </div>
    </div>`;
  });
  const aheadTotal=S.debts.reduce((a,d)=>{
    const p=amountOf(d), int=(+d.balance||0)*(+d.apr||0)/100/12;
    const exp=Math.max(0,(+d.balance||0)+int-p);
    const act=rec.actuals[d.id];
    if(act===undefined||act===null||act==='') return a;
    return a+(exp-(+act));
  },0);
  const anyActuals=S.debts.some(d=>{ const a=rec.actuals[d.id]; return a!==undefined&&a!==null&&a!==''; });
  if(anyActuals){
    h+=`<div class="card" style="border-color:${aheadTotal>0.5?'var(--live)':aheadTotal<-0.5?'var(--warn)':'var(--line)'}">
      <div class="lab"><b style="color:${aheadTotal>0.5?'var(--live)':aheadTotal<-0.5?'var(--warn)':'var(--paper)'}">
        ${aheadTotal>0.5?'You are '+gbp(aheadTotal)+' ahead of plan':aheadTotal<-0.5?'You are '+gbp(Math.abs(aheadTotal))+' behind plan':'Bang on plan'}</b>
      <span>${aheadTotal>0.5?'More debt cleared than the payments alone would have managed.'
        :aheadTotal<-0.5?'Worth finding out which account and why before you close the month.'
        :'Every balance landed where it should have.'}</span></div>
    </div>`;
  }
  const r=buildRun();
  h+=`<div class="grouphead">Month summary<em>${monthName(S.current)}</em></div>
  <div class="stats">
    <div class="stat"><div class="k">In</div><div class="v">${gbp(r.income)}</div></div>
    <div class="stat"><div class="k">Allocated</div><div class="v">${gbp(r.allocated)}</div></div>
    <div class="stat"><div class="k">Left over</div><div class="v" style="color:var(--live)">${gbp(r.living)}</div></div>
  </div>
  <div class="row-btns">
    <button class="btn ghost" id="savePdf2">Save statement as PDF</button>
    <button class="btn" id="closeMonth">Close ${monthName(S.current)} and roll forward</button>
  </div>
  <p class="note">Rolling forward copies every rule into next month, moves your real balances across, clears the ticks, and files this month in the record below.</p>`;

  if(S.history.length){
    h+=`<div class="grouphead">Record</div><table class="hist">
      <tr><th>Month</th><th>In</th><th>Out</th><th>Saved</th><th>Debt</th></tr>`+
      S.history.slice().reverse().map(x=>`<tr><td>${monthName(x.month)}</td><td>${gbp(x.income)}</td><td>${gbp(x.out)}</td><td>${gbp(x.saved)}</td><td>${gbp(x.debt)}</td></tr>`).join('')+
      `</table>`;
  }
  document.getElementById('tab-close').innerHTML=h;
}

/* ---------- helpers ---------- */
function esc(s){return String(s??'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
const TABS={
  run:'Run', in:'Money in', out:'Outgoings', events:'Coming up', debt:'Debts', acc:'Accounts',
  ot:'Overtime', inv:'Savings', cal:'Calendar', trend:'Trends', alerts:'Alerts', close:'Close month', help:'How to', set:'Settings',
  plans:'Plans', who:'Who pays', time:'Commitments'
};
const ALL_PERSONAL=['run','in','out','cal','events','debt','acc','inv','ot','trend','alerts','close','help','set'];
const ALL_JOINT=['plans','who','time','help','set'];
const DEFAULT_BAR=['run','in','out','debt'];
function barTabs(){
  if(isJoint()) return ['plans','who','time'];
  const saved=st('navTabs');

function alertCount(){ try{ return isJoint()?0:alerts().filter(a=>a.level!=='ok').length; }catch(e){ return 0; } }

function renderNav(){

  let h=bar.map(k=>{
    const badge=(k==='alerts'&&alertCount())?`<span class="dot">${alertCount()}</span>`:'';

function closeMonth(){
  const rec=mrec(S.current);
  const r0=buildRun();
  if(st('warnUncovered')&&r0.remaining>0.005){
    if(!confirm(`${gbp(r0.remaining)} on the run is still unticked. Close ${monthName(S.current)} anyway?`)) return;
  }
  const snap=liveSnapshot();          // capture before anything moves
  S.debts.forEach(d=>{
    const p=amountOf(d), int=(+d.balance||0)*(+d.apr||0)/100/12;
    const a=rec.actuals[d.id];
    d.balance=+((a!==undefined&&a!==''&&a!==null)?+a:Math.max(0,(+d.balance||0)+int-p)).toFixed(2);
  });
  // bank this month's contribution against each planned event
  (S.events||[]).forEach(e=>{
    const m=eventMonthly(e);
    if(m>0) e.saved=+(Math.min(+e.target||0,(+e.saved||0)+m)).toFixed(2);
  });
  rec.closed=true;
  S.history=S.history.filter(h=>h.month!==S.current);
  snap.debt=S.debts.reduce((a,d)=>a+(+d.balance||0),0);   // closing balance, post-payment
  S.history.push(snap);
  const next=shiftMonth(S.current,1);
  if(st('carryOneoffs')) S.oneoffs.forEach(o=>{ if(o.month===S.current) o.month=next; });
  S.current=next;
  const nrec=mrec(S.current);
  if(st('clearTicks')) nrec.ticks={};
  save(); renderAll(); toast('Rolled into '+monthName(S.current));
}
/* ---------- monthly statement → PDF ---------- */
function row(label,amount,cls){
  return `<div class="st-row ${cls||''}"><span class="l">${label}</span><i class="d"></i><span class="a">${amount}</span></div>`;
}
function buildStatement(){
  const k=S.current, r=buildRun(), rec=mrec(k);
  let h=`<div class="st-head">
    <h1 class="st-mark">${esc(st('appName'))}</h1>
    <div class="st-sub"><span>Monthly statement</span><span>${monthName(k)}</span>
      <span>${rec.closed?'Closed':'Open'}</span></div>
  </div>`;

  if(st('pdfIncome')){
    h+=`<div class="st-sec"><h4>Money in</h4>`;
    INC().forEach(i=>h+=row(i.name+(i.received?'':' — not received'),gbp(i.received?i.amount:0)));
    h+=row('Total confirmed',gbp(r.income),'tot')+`</div>`;
  }

  r.sections.forEach(s=>{
    h+=`<div class="st-sec"><h4>${s.n} · ${s.title}</h4>`;
    s.lines.forEach(l=>{
      h+=row(l.name+(l.method==='dd'?' (direct debit)':''),gbp(l.amount));
      if(l.parts&&l.parts.length>1&&st('showBreakdowns')) l.parts.forEach(p=>h+=row(p.name,gbp(p.amount),'sub'));
    });
    h+=row('Section total',gbp(s.lines.reduce((a,l)=>a+l.amount,0)),'tot')+`</div>`;
  });

  h+=`<div class="st-sec">`+row('Total allocated',gbp(r.allocated),'tot')+`</div>
  <div class="st-live"><span>Money to live off</span>
    <b>${gbp(r.living)}</b>
    <span>${gbp(r.living/(+st('weeks')||4.345))} / week</span></div>`;

  if(S.debts.length&&st('pdfDebt')){
    h+=`<div class="st-sec"><h4>Debt reconciliation</h4><table class="st-tbl">
      <tr><th>Account</th><th>APR</th><th>Opened</th><th>Paid</th><th>Interest</th><th>Should be</th><th>Actually</th><th>Ahead</th></tr>`;
    S.debts.forEach(d=>{
      const p=amountOf(d), int=(+d.balance||0)*(+d.apr||0)/100/12;
      const exp=Math.max(0,(+d.balance||0)+int-p);
      const a=rec.actuals[d.id], has=a!==undefined&&a!==null&&a!=='';
      const v=has?(exp-(+a)):0;
      h+=`<tr><td>${d.name}</td><td>${(+d.apr||0).toFixed(1)}%</td><td>${gbp(d.balance)}</td>
        <td>−${gbp(p)}</td><td>+${gbp(int)}</td><td>${gbp(exp)}</td>
        <td>${has?gbp(+a):'—'}</td><td>${has?(v>0?'+':'')+gbp(v):'—'}</td></tr>`;
    });
    h+=`<tr><td><b>Total owed</b></td><td></td><td><b>${gbp(S.debts.reduce((x,d)=>x+(+d.balance||0),0))}</b></td>
      <td colspan="5"></td></tr></table></div>`;
  }

  if((S.events||[]).length&&st('pdfEvents')){
    h+=`<div class="st-sec"><h4>${esc(title('s4'))}</h4><table class="st-tbl">
      <tr><th>Event</th><th>Needed by</th><th>Cost</th><th>Put by</th><th>To find</th><th>Per month</th></tr>`;
    S.events.forEach(e=>h+=`<tr><td>${e.name}</td><td>${monthName(e.dueMonth||k)}</td>
      <td>${gbp(e.target)}</td><td>${gbp(e.saved)}</td>
      <td>${gbp(Math.max(0,(+e.target||0)-(+e.saved||0)))}</td><td>${gbp(eventMonthly(e))}</td></tr>`);
    h+=`</table></div>`;
  }

  h+=`<div class="st-foot"><span>Prepared ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</span>
    <span>${esc(st('pdfFooter')||st('appName'))} · ${monthName(k)}</span></div>`;
  document.getElementById('statement').innerHTML=h;
}

function rawDownload(name,text,type){

    const a=document.createElement('a'); a.href=u; a.download=name;
    document.body.appendChild(a); a.click();

async function checkInstall(){
  const base=location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'');
  const files=['manifest.webmanifest','icon-192.png','icon-512.png','icon-maskable.png','sw.js'];
  const lines=[]; let bad=0;
  for(const f of files){
    try{
      const r=await fetch(base+f,{cache:'no-store'});
      const type=r.headers.get('content-type')||'';
      if(!r.ok){ lines.push('MISSING  '+f+'  ('+r.status+')'); bad++; }
      else if(f.endsWith('.png')&&!/image/.test(type)){ lines.push('WRONG TYPE  '+f+'  ('+type+')'); bad++; }
      else lines.push('ok  '+f);
    }catch(e){ lines.push('FAILED  '+f); bad++; }
  }
  let sw='no worker registered';
  try{
    if('serviceWorker' in navigator){
      const rs=await navigator.serviceWorker.getRegistrations();
      sw=rs.length?('worker active, scope '+rs[0].scope):'no worker registered';
    }
  }catch(e){}
  const standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  const report=
    'Address: '+base+'\n\n'+lines.join('\n')+'\n\n'+sw+'\nRunning '+(standalone?'installed':'in the browser')+
    '\n\n'+(bad?('>>> '+bad+' file(s) not reachable. Upload them into the same folder as index.html — that is what makes the icon come out grey.')
              :'>>> All present. If the icon is still grey, remove it and install again.');
  showExport('install-check.txt',report,'text/plain');
}

  lkPick=last?last.id:vault.profiles[0].id;
  if(last&&!last.locked){ await openProfile(last.id); unlockUI(); }
  else renderLock();
})();
</script>
