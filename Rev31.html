<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0D1A28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="B.O.B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Bank of Bindi — Payday Run</title>
<style>
:root{
  --ink:#0D1A28; --ink2:#142536; --ink3:#1B3149;
  --line:#24394F; --line-soft:rgba(223,167,72,.22);
  --brass:#DFA748; --brass-dim:#9A7433;
  --paper:#EDF3F9; --mute:#8CA3BA;
  --live:#6FBF9A; --warn:#E2725B; --calm:#7FA8CC;
  --r:10px;
  --display:'Oswald','Haettenschweiler','Arial Narrow',Impact,sans-serif;
  --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}

/* ---------- app chrome ---------- */
header{
  background:linear-gradient(180deg,var(--ink2),var(--ink));
  border-bottom:1px solid var(--line);
  padding:max(10px,env(safe-area-inset-top)) 10px 8px!important;
  position:sticky;top:0;z-index:20;
}
.topbar{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:6px;max-width:760px;margin:0 auto}
.icn{
  width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:transparent;
  color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:none;
}
.icn:active{background:var(--ink3)}
.icn svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.icn.on{color:var(--brass)}
.topright{display:flex;gap:2px;justify-self:end}
.titleblock{text-align:center;min-width:0;overflow:hidden}
.monthline{display:flex;align-items:center;justify-content:center;gap:2px}
.chev{background:none;border:none;color:var(--mute);font-size:20px;line-height:1;
  padding:2px 8px;cursor:pointer;opacity:.7}
.chev:active{color:var(--brass)}
.mtitle{
  font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.14em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stamp{justify-content:center;padding:1px 0 0;font-size:9px;opacity:.85}

/* ---------- bottom bar ---------- */
.botnav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:space-around;align-items:stretch;
  background:color-mix(in srgb,var(--ink2) 92%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.botnav button{
  flex:1;background:none;border:none;color:var(--mute);cursor:pointer;
  padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:600;letter-spacing:.02em;position:relative;min-width:0;
}
.botnav button svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.botnav button[aria-selected="true"]{color:var(--brass)}
.botnav button[aria-selected="true"] .lbl{opacity:1}
.botnav .lbl{opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.botnav .dot{
  position:absolute;top:5px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:99px;
  background:var(--warn);color:var(--ink);font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}

/* ---------- more sheet ---------- */
.sheet-more{
  position:fixed;inset:0;z-index:40;background:rgba(4,10,16,.6);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet-more .inner{
  background:var(--ink2);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  width:100%;max-width:560px;padding:14px 14px calc(20px + env(safe-area-inset-bottom));
}
.sheet-more .grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet-more .grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet-more .grid2 button{
  background:var(--ink);border:1px solid var(--line);border-radius:14px;color:var(--paper);
  padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;
  font-size:11.5px;font-weight:600;cursor:pointer;position:relative;
}
.sheet-more .grid2 button svg{width:22px;height:22px;stroke:var(--brass);stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.sheet-more .grid2 button[aria-selected="true"]{border-color:var(--brass)}

/* ---------- pull to sync ---------- */
.ptr{
  position:fixed;top:0;left:50%;z-index:25;
  width:36px;height:36px;border-radius:99px;
  background:var(--ink2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-52px);opacity:0;pointer-events:none;
  transition:transform .2s ease,opacity .2s ease;
}
.ptr.drag{transition:none}
.ptr.armed{border-color:var(--brass)}
.ptr svg{width:19px;height:19px;stroke:var(--mute);stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.ptr.armed svg,.ptr.busy svg{stroke:var(--brass)}
.ptr.busy{transform:translate(-50%,58px);opacity:1}
.ptr.busy svg{animation:ptspin .85s linear infinite;transform-origin:50% 50%}
@keyframes ptspin{to{transform:rotate(360deg)}}

/* ---------- app feel ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  touch-action:manipulation;                 /* no double-tap zoom, no 300ms delay */
  overscroll-behavior:none;                  /* no rubber-band bounce past the ends */
  -webkit-tap-highlight-color:transparent;   /* no grey flash on tap */
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  min-height:100dvh;
}
input,textarea,select,.num,.lamt,.big,.st-row,#statement{
  -webkit-user-select:text; user-select:text; -webkit-touch-callout:default;
}
button{touch-action:manipulation}
button svg,button *{pointer-events:none}      /* taps always resolve to the button itself */
.icn{position:relative}
.icn::after{content:"";position:absolute;inset:-4px}   /* a slightly larger target than it looks */
/* stay clear of notches and the home indicator */
header{padding-top:max(18px,env(safe-area-inset-top))!important}
main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.lockscreen{padding-top:max(26px,env(safe-area-inset-top));padding-bottom:max(26px,env(safe-area-inset-bottom))}
.modal .sheet{padding-bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px))}
body{
  background:var(--ink); color:var(--paper); font-family:var(--body);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(86px + env(safe-area-inset-bottom));
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- masthead ---------- */
header{
  background:linear-gradient(180deg,var(--ink2),var(--ink));
  border-bottom:1px solid var(--line);
  padding:18px 16px 0;
  position:sticky;top:0;z-index:20;
}
.wordmark{
  font-family:var(--display); font-weight:700; font-size:30px; line-height:1;
  letter-spacing:.06em; text-transform:uppercase; color:var(--brass);
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
}
.wordmark span{
  font-family:var(--body); font-size:11px; font-weight:600; letter-spacing:.18em;
  color:var(--mute);
}
.monthbar{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
.monthbar button{
  background:transparent;border:1px solid var(--line);color:var(--mute);
  width:32px;height:32px;border-radius:8px;cursor:pointer;line-height:1;
}
.monthbar button:hover{border-color:var(--brass);color:var(--brass)}
.monthlabel{font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:16px;flex:1}
.badge{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--brass);padding:3px 7px;border-radius:99px;font-weight:700}
.badge.open{background:transparent;color:var(--mute);border:1px solid var(--line)}

nav{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:none;border:none;border-bottom:2px solid transparent;
  padding:10px 12px;color:var(--mute);cursor:pointer;white-space:nowrap;
  font-size:13px;font-weight:600;letter-spacing:.03em;
}
nav button[aria-selected="true"]{color:var(--brass);border-bottom-color:var(--brass)}

main{max-width:760px;margin:0 auto;padding:16px}
.hidden{display:none!important}

/* ---------- allocation counter (signature) ---------- */
.counter{
  border:1px solid var(--line-soft); border-radius:var(--r);
  background:
    repeating-linear-gradient(180deg,transparent 0 27px,rgba(255,255,255,.02) 27px 28px),
    var(--ink2);
  padding:18px 18px 16px; margin-bottom:18px; position:relative; overflow:hidden;
}
.counter::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:6px;
  background:repeating-linear-gradient(90deg,var(--ink2) 0 8px,var(--ink) 8px 16px);
}
.counter .cap{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.counter .big{font-family:var(--mono);font-size:38px;font-weight:700;line-height:1.1;margin:2px 0 6px}
.counter .big.done{color:var(--live)}
.meter{height:4px;background:var(--ink3);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brass);width:0;transition:width .35s ease}
.counter .sub{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:12px;color:var(--mute)}

/* ---------- run sections ---------- */
.sec{margin:0 0 14px}
.sec>h3{
  font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mute);margin:0 0 8px;
  display:flex;align-items:center;gap:10px;
}
.sec>h3 b{font-family:var(--mono);color:var(--brass-dim);font-size:12px;font-weight:700}
.sec>h3::after{content:"";flex:1;height:1px;background:var(--line)}

.line{
  display:flex;align-items:center;gap:12px;
  background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;margin-bottom:6px;
}
.line.is-done{opacity:.42}
.line.is-done .lname{text-decoration:line-through}
.tick{
  appearance:none;-webkit-appearance:none;flex:none;
  width:26px;height:26px;border:1.5px solid var(--brass-dim);border-radius:7px;
  background:transparent;cursor:pointer;position:relative;
}
.tick:checked{background:var(--brass);border-color:var(--brass)}
.tick:checked::after{
  content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;
  border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:rotate(42deg);
}
.lmid{flex:1;min-width:0}
.lname{font-weight:600;font-size:14px}
.lmeta{font-size:11px;color:var(--mute);margin-top:2px}
.chip{
  display:inline-block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--mute);margin-right:6px;
}
.chip.dd{border-color:var(--calm);color:var(--calm)}
.chip.tr{border-color:var(--brass-dim);color:var(--brass)}
.lamt{font-family:var(--mono);font-weight:700;font-size:15px;white-space:nowrap}
details.brk{margin:-2px 0 8px 38px}
details.brk summary{font-size:11px;color:var(--mute);cursor:pointer;padding:4px 0}
details.brk ul{list-style:none;margin:2px 0 6px;padding:0}
details.brk li{display:flex;font-size:12px;color:var(--mute);padding:2px 0;gap:6px}
details.brk li i{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px)}

/* ---------- living money ---------- */
.living{
  border:1px solid var(--live);border-radius:var(--r);
  background:linear-gradient(180deg,rgba(111,191,154,.10),transparent);
  padding:18px;text-align:center;margin-top:18px;
}
.living .cap{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--live)}
.living .big{font-family:var(--mono);font-size:36px;font-weight:700;color:var(--live);line-height:1.15;margin:4px 0}
.living .split{display:flex;justify-content:center;gap:20px;font-size:12px;color:var(--mute);margin-top:6px}
.living.neg{border-color:var(--warn);background:linear-gradient(180deg,rgba(226,114,91,.12),transparent)}
.living.neg .cap,.living.neg .big{color:var(--warn)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:11px}
.stat .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.stat .v{font-family:var(--mono);font-size:17px;font-weight:700;margin-top:3px}

/* ---------- editor rows ---------- */
.card{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.card .top{display:flex;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-top:10px}
label.f{display:block}
label.f span{display:block;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
input[type=date],input[type=month],input[type=time]{
  -webkit-appearance:none; appearance:none;
  background:var(--ink)!important; background-image:none!important;
  color:var(--paper)!important;
  border:1px solid var(--line); border-radius:7px; padding:8px 9px; width:100%;
  font-family:var(--mono); font-size:13px; min-height:38px;
}
input[type=date]::-webkit-date-and-time-value{ text-align:left; color:var(--paper) }
input[type=date]::-webkit-calendar-picker-indicator,
input[type=month]::-webkit-calendar-picker-indicator{
  filter:invert(78%) sepia(38%) saturate(700%) hue-rotate(348deg); opacity:.9; cursor:pointer;
}
input[type=date]::-webkit-datetime-edit,
input[type=month]::-webkit-datetime-edit{ color:var(--paper) }
input[type=text],input[type=number],select{
  width:100%;background:var(--ink);border:1px solid var(--line);border-radius:7px;
  padding:8px 9px;color:var(--paper);
}
input.name{font-weight:600;border-color:transparent;background:transparent;padding:4px 0}
input.name:hover{border-bottom-color:var(--line)}
input[type=number]{font-family:var(--mono)}
.del{background:none;border:none;color:var(--mute);cursor:pointer;font-size:18px;padding:2px 6px;flex:none}
.del:hover{color:var(--warn)}
.add{
  width:100%;background:transparent;border:1px dashed var(--line);color:var(--mute);
  padding:11px;border-radius:var(--r);cursor:pointer;font-weight:600;margin-bottom:18px;
}
.add:hover{border-color:var(--brass);color:var(--brass)}
.btn{
  background:var(--brass);border:none;color:var(--ink);font-weight:700;
  padding:12px 16px;border-radius:9px;cursor:pointer;letter-spacing:.02em;
}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);font-weight:600}
.btn.ghost:hover{border-color:var(--brass)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}

.grouphead{
  font-family:var(--display);letter-spacing:.16em;text-transform:uppercase;font-size:12px;
  color:var(--brass);margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline;
}
.grouphead em{font-family:var(--mono);font-style:normal;color:var(--mute);font-size:12px}
.note{font-size:12px;color:var(--mute);line-height:1.6}
.ibtn{
  display:inline-flex;align-items:center;justify-content:center;
  width:17px;height:17px;border-radius:99px;border:1px solid var(--brass-dim);
  background:transparent;color:var(--brass);font-size:10px;font-weight:700;font-style:italic;
  font-family:Georgia,serif;line-height:1;cursor:pointer;padding:0;vertical-align:middle;
  margin-left:6px;flex:none;
}
.ibtn:active,.ibtn[aria-expanded="true"]{background:var(--brass);color:var(--ink)}
.ihint{
  font-size:12px;color:var(--mute);line-height:1.6;
  border-left:2px solid var(--brass-dim);padding:2px 0 2px 9px;margin:7px 0 2px;
}
.hintbar{display:flex;justify-content:flex-end;margin:-2px 0 8px}
.recv{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mute)}

/* reconcile table */
.rec{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.rec .hdr{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rec .hdr b{font-size:14px}
.recgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin-top:10px;font-size:11px}
.recgrid div span{display:block;color:var(--mute);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
.recgrid div b{font-family:var(--mono);font-size:14px;font-weight:700}
.var-ok{color:var(--live)} .var-bad{color:var(--warn)}

.hist{width:100%;border-collapse:collapse;font-size:13px}
.hist th{text-align:left;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);padding:6px 4px;border-bottom:1px solid var(--line)}
.hist td{padding:9px 4px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.hist td:first-child{font-family:var(--body);font-weight:600}

.howto{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:16px}
.howto summary{cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.04em}
.howto ol{margin:10px 0 0;padding-left:20px;font-size:13px;color:var(--mute);line-height:1.7}
.howto ol b{color:var(--paper)}
.toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  background:var(--brass);color:var(--ink);font-weight:700;font-size:13px;
  padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;
}
.toast.show{opacity:1}
.stamp{
  display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.08em;
  color:var(--mute);padding:6px 0 2px;font-family:var(--mono);
}
.stamp .dot{width:6px;height:6px;border-radius:99px;background:var(--live);flex:none}
.stamp .dot.warn{background:var(--warn)}
.stamp .sep{opacity:.4}
.alert{
  border:1px solid var(--warn);background:rgba(226,114,91,.10);border-radius:var(--r);
  padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.55;
}
.alert b{color:var(--warn)}

/* ---------- calendar ---------- */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.calhead div{text-align:center;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.cell{
  background:var(--ink2);border:1px solid var(--line);border-radius:9px;
  min-height:52px;padding:4px 3px 3px;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;position:relative;overflow:hidden;
}
.cell.blank{background:transparent;border-color:transparent;cursor:default}
.cell .dnum{font-family:var(--mono);font-size:11px;color:var(--mute)}
.cell.today{border-color:var(--brass)}
.cell.today .dnum{color:var(--brass);font-weight:700}
.cell.sel{border-color:var(--paper);background:var(--ink3)}
.cell .amt{font-family:var(--mono);font-size:9.5px;line-height:1.25;margin-top:2px;text-align:center}
.cell .amt .o{color:var(--warn)}
.cell .amt .i{color:var(--live)}
.cell .neg{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--warn)}
.balrow{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:3px}

/* ---------- tablet, landscape ----------
   The bottom bar becomes a sidebar, every tab is visible at once, and the
   list pages run in two columns so the width is actually used.
------------------------------------------------------------------------- */
@media (min-width:900px){
  body{padding-bottom:0;padding-left:calc(212px + env(safe-area-inset-left))}
  .botnav{
    top:0;bottom:0;right:auto;left:0;width:calc(212px + env(safe-area-inset-left));
    flex-direction:column;justify-content:flex-start;align-items:stretch;
    border-top:none;border-right:1px solid var(--line);

  const d=new Date(iso), now=new Date();
  const mins=Math.round((now-d)/60000);
  if(mins<1) return 'just now';
  if(mins<60) return mins+' min ago';
  const sameDay=d.toDateString()===now.toDateString();
  if(sameDay) return 'today '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const yst=new Date(now); yst.setDate(now.getDate()-1);
  if(d.toDateString()===yst.toDateString()) return 'yesterday '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

/* ---------- storage ----------
   Three tiers, tried in order:
   1. window.storage — present when this runs inside Claude
   2. browser storage — used when you've saved the file to your phone/desktop
   3. memory only — last resort; export a JSON backup before closing
--------------------------------------------------------------- */
let STORE='memory';
const Store={
  async get(k){
    if(typeof window.storage!=='undefined'){
      try{ const r=await window.storage.get(k); STORE='claude'; return r&&r.value?r.value:null; }catch(e){}
    }
    try{ const v=window.localStorage.getItem(k); STORE='device'; return v; }catch(e){}
    STORE='memory'; return null;
  },
  async set(k,v){
    if(STORE==='claude'){ try{ await window.storage.set(k,v); return true; }catch(e){} }
    try{ window.localStorage.setItem(k,v); STORE=(STORE==='claude')?'claude':'device'; return true; }catch(e){}
    return false;
  }
};

/* ---------- vault: many profiles, each sealed with its own PIN ----------

   The figures are encrypted with a key derived from the PIN and never stored.
------------------------------------------------------------------------ */
const VKEY='bob-vault-v1';
let vault=null, activeId=null, cryptoKey=null, idleT=null;
const HAS_CRYPTO = !!(window.crypto&&window.crypto.subtle);
const ENC=new TextEncoder(), DEC=new TextDecoder();
const b64=b=>btoa(String.fromCharCode.apply(null,new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function deriveKey(pin,salt){
  const km=await crypto.subtle.importKey('raw',ENC.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(obj,key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,ENC.encode(JSON.stringify(obj)));
  return {iv:b64(iv),ct:b64(ct)};
}
async function unseal(rec,key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.iv)},key,unb64(rec.ct));
  return JSON.parse(DEC.decode(pt));
}
function normalise(o){
  if(!o.months) o.months={};
  if(!o.events) o.events=[];
  if(!o.history) o.history=[];
  if(!o.meta) o.meta={};
  if(!o.settings) o.settings={};
  if(o.kind==='joint'){ if(!o.members) o.members=[]; if(!o.plans) o.plans=[]; }
  if(o.kind!=='joint'&&!o.migratedPlans){          // lift the old single list into the open month
    if(!o.months) o.months={};
    const k=o.current;
    if(!o.months[k]) o.months[k]={ticks:{},closed:false,actuals:{}};
    if(!o.months[k].plan)
      o.months[k].plan={income:JSON.parse(JSON.stringify(o.income||[])),
                        items:JSON.parse(JSON.stringify(o.items||[]))};
    o.migratedPlans=true;
  }
  return o;
}

async function createProfile(name,pin,useSample,kind){

  if(pin&&HAS_CRYPTO){

/* ---------- accounts ----------
   Balances live here; any overdraft in use is surfaced on the Debts page,
   so every liability is still read in one place.
--------------------------------------------------------------------- */
const ACC_KINDS=['Incoming','Daily spending','Bills','Business','Savings','Giving','Other'];
function accounts(){ if(!S.accounts) S.accounts=[]; return S.accounts; }
function accBalance(a){ return +a.balance||0; }
function odUsed(a){ return Math.max(0,-accBalance(a)); }
function odLimit(a){ return +a.overdraft||0; }
function odHeadroom(a){ return Math.max(0,odLimit(a)-odUsed(a)); }
function accountsTotal(){ return accounts().reduce((x,a)=>x+accBalance(a),0); }
function accountsPositive(){ return accounts().reduce((x,a)=>x+Math.max(0,accBalance(a)),0); }
function overdraftDebt(){ return accounts().reduce((x,a)=>x+odUsed(a),0); }
function debtsTotal(){ return S.debts.reduce((a,d)=>a+(+d.balance||0),0)+overdraftDebt(); }
function netPosition(){ return accountsPositive()-debtsTotal(); }
function annualInterest(a){ return Math.max(0,accBalance(a))*(+a.rate||0)/100; }

/* ---------- per-month plans ----------
   Each month owns its own income and outgoings. A month that has never been
   opened inherits the nearest earlier month, so setups carry forward on their
   own — but editing one month never reaches back and rewrites an older one.
------------------------------------------------------------------------- */
function clone(x){ return JSON.parse(JSON.stringify(x||[])); }
function nearestPlan(k){
  const keys=Object.keys(S.months||{}).filter(x=>x<k&&S.months[x]&&S.months[x].plan).sort();
  if(keys.length) return S.months[keys[keys.length-1]].plan;
  const later=Object.keys(S.months||{}).filter(x=>x>k&&S.months[x]&&S.months[x].plan).sort();
  if(later.length) return S.months[later[0]].plan;      // first ever month, nothing behind it
  return null;
}
function monthPlan(k){
  k=k||S.current;
  const m=mrec(k);
  if(!m.plan){
    const src=nearestPlan(k);
    m.plan = src ? {income:clone(src.income),items:clone(src.items)}
                 : {income:clone(S.income),items:clone(S.items)};   // from the legacy single list
  }
  if(!m.plan.income) m.plan.income=[];
  if(!m.plan.items) m.plan.items=[];
  return m.plan;
}
function INC(){ return monthPlan(S.current).income; }
function ITEMS(){ return monthPlan(S.current).items; }
function setINC(v){ monthPlan(S.current).income=v; }
function setITEMS(v){ monthPlan(S.current).items=v; }
/* push this month's setup into a month that already exists */
function copyPlanForward(k){
  const from=monthPlan(S.current), m=mrec(k);
  m.plan={income:clone(from.income),items:clone(from.items)};
}

function incomeTotal(){
  const exp=st('incomeBasis')==='expected';
  return INC().filter(i=>exp||i.received).reduce((a,b)=>a+(+b.amount||0),0);
}
function incomePlanned(){ return INC().reduce((a,b)=>a+(+b.amount||0),0); }
function baseAmount(base){
  if(base==='all') return incomeTotal();
  const s=INC().find(i=>i.id===base);
  if(!s) return 0;
  return (st('incomeBasis')==='expected'||s.received)?(+s.amount||0):0;
}
function amountOf(x){
  return x.mode==='pct' ? +( baseAmount(x.base)*(+x.pct||0)/100 ).toFixed(2) : (+x.amount||0);
}
function oneoffsFor(k){ return S.oneoffs.filter(o=>o.month===k); }

function roundUp(n){
  const r=+st('roundTo')||0;
  return r>0 ? Math.ceil(n/r)*r : +n.toFixed(2);
}
function orderedDebts(){
  const d=[...S.debts];
  const o=st('debtOrder');
  if(o==='apr') return d.sort((a,b)=>(+b.apr||0)-(+a.apr||0));
  if(o==='small') return d.sort((a,b)=>(+a.balance||0)-(+b.balance||0));
  if(o==='large') return d.sort((a,b)=>(+b.balance||0)-(+a.balance||0));
  return d;
}
function buildRun(){
  const k=S.current, rec=mrec(k), sections=[];
  // 1. recurring outgoings by pot (excluding savings)
  const pots={};
  ITEMS().filter(i=>i.group!=='Savings & investments').forEach(i=>{
    const a=amountOf(i); if(a<=0) return;
    const key=i.pot+'|'+i.method;
    (pots[key]=pots[key]||{pot:i.pot,method:i.method,total:0,parts:[]});
    pots[key].total+=a; pots[key].parts.push({name:i.name,amount:a});
  });
  const potLines=Object.entries(pots).map(([key,p])=>({
    id:'pot:'+key, name:p.pot+' pot', method:p.method, amount:roundUp(p.total), parts:p.parts, pot:p.pot
  })).sort((a,b)=>b.amount-a.amount);
  if(potLines.length&&!hidden('s1')) sections.push({n:'01',title:title('s1'),lines:potLines});

  // 2. debts
  const dLines=orderedDebts().map(d=>({
    id:'debt:'+d.id, name:d.name, method:d.method, amount:amountOf(d),
    meta:`Balance ${gbp(d.balance)} · ${(+d.apr||0).toFixed(1)}% APR`
  })).filter(l=>l.amount>0);
  if(dLines.length&&!hidden('s2')) sections.push({n:'02',title:title('s2'),lines:dLines});

  // 3. one-offs this month
  const oo=oneoffsFor(k);
  if(oo.length&&!hidden('s3')){
    sections.push({n:'03',title:title('s3'),lines:[{
      id:'oneoff:'+k, name:'One-offs pot', method:'transfer', pot:'One-offs',
      amount:roundUp(oo.reduce((a,b)=>a+(+b.amount||0),0)),
      parts:oo.map(o=>({name:o.name,amount:+o.amount||0}))
    }]});
  }
  // 4. planned events — sinking funds
  const ev=(S.events||[]).map(e=>({e,m:eventMonthly(e)})).filter(x=>x.m>0);
  if(ev.length&&!hidden('s4')){
    sections.push({n:'04',title:title('s4'),lines:[{
      id:'events:'+k, name:'Events pot', method:'transfer', pot:'Events',
      amount:roundUp(ev.reduce((a,x)=>a+x.m,0)),
      parts:ev.map(x=>({name:x.e.name+(monthsUntil(x.e.dueMonth)<=0?' — due now':''),amount:x.m}))
    }]});
  }
  // 5. savings
  const sv=ITEMS().filter(i=>i.group==='Savings & investments').map(i=>({
    id:'save:'+i.id,name:i.name,method:i.method,amount:amountOf(i),pot:i.pot
  })).filter(l=>l.amount>0);
  if(sv.length&&!hidden('s5')) sections.push({n:'05',title:title('s5'),lines:sv});

  const allocated=sections.flatMap(s=>s.lines).reduce((a,l)=>a+l.amount,0);
  const done=sections.flatMap(s=>s.lines).filter(l=>rec.ticks[l.id]).reduce((a,l)=>a+l.amount,0);
  const income=incomeTotal();
  return {sections,allocated,done,income,living:income-allocated,remaining:allocated-done};
}

/* ---------- snapshot: one month reduced to comparable numbers ---------- */
function liveSnapshot(){
  const r=buildRun(), pots={};
  ITEMS().filter(i=>i.group!=='Savings & investments').forEach(i=>{
    const a=amountOf(i); if(a>0) pots[i.pot]=+((pots[i.pot]||0)+a).toFixed(2);
  });
  const dp=S.debts.reduce((a,d)=>a+amountOf(d),0); if(dp>0) pots['Debt']=+dp.toFixed(2);
  const oo=oneoffsFor(S.current).reduce((a,o)=>a+(+o.amount||0),0); if(oo>0) pots['One-offs']=+oo.toFixed(2);
  const ev=(S.events||[]).reduce((a,e)=>a+eventMonthly(e),0); if(ev>0) pots['Events']=+ev.toFixed(2);
  const sv=savingsTotal(); if(sv>0) pots['Savings']=+sv.toFixed(2);
  return {
    month:S.current, income:r.income, out:r.allocated, saved:sv, living:r.living,
    debt:S.debts.reduce((a,d)=>a+(+d.balance||0),0), pots
  };
}
/* every month on record, oldest first, with the open month on the end */
function timeline(){
  const past=(S.history||[]).slice().sort((a,b)=>a.month.localeCompare(b.month))
    .filter(h=>h.month!==S.current);
  return past.concat([liveSnapshot()]);
}

/* ---------- overtime & tax ----------
   Bands are editable because governments move them and this app is meant to outlive them.
   Defaults are England/Wales/NI, thresholds as frozen.
------------------------------------------------------------------- */
const OT_DEF={
  rate:18, mulWeekday:1.5, mulWeekend:2, baseSalary:35100,
  pa:12570, basicTo:50270, higherTo:125140, r1:20, r2:40, r3:45,
  niFrom:12570, niTo:50270, ni1:8, ni2:2, arrears:0,
  contractHours:37.5, weeksPerYear:52,
  startRate:0, rises:[], backpay:[],
  penPct:0, penType:'netpay', penBasis:'full', penEmployer:3,
  penOnOvertime:true, qualLower:6240, qualUpper:50270,
  slPlan:'none', slThresh:27295, slPct:9,
  entries:[]
};
function ot(){ if(!S.ot) S.ot=JSON.parse(JSON.stringify(OT_DEF)); 
  for(const k in OT_DEF) if(S.ot[k]===undefined) S.ot[k]=OT_DEF[k];
  return S.ot; }
function otNum(k){ const v=+ot()[k]; return isFinite(v)?v:OT_DEF[k]; }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function rises(){ if(!ot().rises) ot().rises=[]; return ot().rises
  .slice().sort((a,b)=>String(a.from||'').localeCompare(String(b.from||''))); }
/* the rate that applied on a given day */
function rateOn(dateStr){
  const rs=rises().filter(r=>r.from&&String(r.from)<=String(dateStr));
  if(rs.length) return +rs[rs.length-1].rate||0;
  const all=rises();
  if(all.length) return otNum('startRate')||otNum('rate');   // before the first recorded rise
  return otNum('rate');
}
/* keep the headline rate in step with today's effective rate */
function syncCurrentRate(){
  if(!rises().length) return;
  const r=rateOn(todayISO());
  if(r>0&&Math.abs(r-otNum('rate'))>0.0001){ ot().rate=r; relinkPay('rate'); }
}
function backpay(){ if(!ot().backpay) ot().backpay=[]; return ot().backpay; }
function backpayIn(from,to){
  return backpay().filter(b=>String(b.date)>=from&&String(b.date)<to)
    .reduce((a,b)=>a+(+b.amount||0),0);
}
function taxYearOf(dateStr){
  const y=+String(dateStr).slice(0,4), m=+String(dateStr).slice(5,7);
  return m>=4?y:y-1;
}
function taxYearLabel(y){ return y+'/'+String(y+1).slice(2); }
function taxYearRange(y){ return [y+'-04-01',(y+1)+'-04-01']; }
function allTaxYears(){
  const ys=new Set();
  ot().entries.forEach(e=>ys.add(taxYearOf(e.date)));
  backpay().forEach(b=>ys.add(taxYearOf(b.date)));
  if(!ys.size) ys.add(taxYearOf(todayISO()));
  return [...ys].sort((a,b)=>b-a);
}
function yearSummary(y){
  const [f,t]=taxYearRange(y);
  const es=ot().entries.filter(e=>String(e.date)>=f&&String(e.date)<t);
  const hours=es.reduce((a,e)=>a+(+e.hours||0),0);
  const gross=es.reduce((a,e)=>a+entryPay(e),0);
  const bp=backpayIn(f,t);
  return {year:y,hours:hours,gross:gross,backpay:bp,total:gross+bp,shifts:es.length};
}
function contractYearHours(){ return otNum('contractHours')*otNum('weeksPerYear'); }
function contractMonthHours(){ return contractYearHours()/12; }
/* rate, salary and hours are three views of one thing — changing any one recalculates the others */
function relinkPay(changed){
  const o=ot(), yh=contractYearHours();
  if(yh<=0) return;
  if(changed==='baseSalary') o.rate=+(otNum('baseSalary')/yh).toFixed(4);
  else o.baseSalary=Math.round(otNum('rate')*yh);       // rate or hours moved
}

function allowanceAt(g){
  const pa=otNum('pa');
  if(g<=100000) return pa;
  return Math.max(0,pa-Math.floor((g-100000)/2));
}
function incomeTax(g,extend){
  const pa=allowanceAt(g), b=otNum('basicTo'), h=otNum('higherTo');
  let t=0;
  const taxable=Math.max(0,g-pa);
  const basicBand=Math.max(0,b-otNum('pa'))+(+extend||0);   // relief at source widens the basic band
  const higherBand=Math.max(0,h-b);
  t+=Math.min(taxable,basicBand)*otNum('r1')/100;
  if(taxable>basicBand) t+=Math.min(taxable-basicBand,higherBand)*otNum('r2')/100;
  if(taxable>basicBand+higherBand) t+=(taxable-basicBand-higherBand)*otNum('r3')/100;
  return t;
}
function nationalIns(g){
  const f=otNum('niFrom'), u=otNum('niTo');
  let n=0;
  n+=Math.max(0,Math.min(g,u)-f)*otNum('ni1')/100;
  if(g>u) n+=(g-u)*otNum('ni2')/100;
  return n;
}
/* ---- pension ----
   netpay   — taken off before income tax, after NI
   sacrifice— taken off before both, so it saves NI too
   ras      — paid from take-home, provider reclaims 20%, higher rate widens the band
------------------------------------------------------------------------------ */
function pensionable(g){
  const cap=otNum('penOnOvertime')?g:Math.min(g,otNum('baseSalary'));
  if(ot().penBasis==='qualifying')
    return Math.max(0,Math.min(cap,otNum('qualUpper'))-otNum('qualLower'));
  return cap;
}
function pensionOn(g){
  const type=ot().penType;
  if(type==='none'||!otNum('penPct')) return 0;
  return pensionable(g)*otNum('penPct')/100;
}
function employerOn(g){ return pensionable(g)*otNum('penEmployer')/100; }
function studentLoan(g){
  if(ot().slPlan==='none') return 0;
  return Math.max(0,g-otNum('slThresh'))*otNum('slPct')/100;
}
function payBreakdown(g){
  const type=ot().penType, c=pensionOn(g);
  let taxableG=g, niG=g, extend=0, fromNet=0;
  if(type==='sacrifice'){ taxableG=g-c; niG=g-c; }
  else if(type==='netpay'){ taxableG=g-c; }
  else if(type==='ras'){ extend=c; fromNet=c*0.8; }
  const tax=incomeTax(taxableG,extend), ni=nationalIns(niG), sl=studentLoan(g);
  const deducted=(type==='sacrifice'||type==='netpay')?c:fromNet;
  return {gross:g, pension:c, employer:employerOn(g), tax:tax, ni:ni, sl:sl,
          take:g-tax-ni-sl-deducted, taxableG:taxableG};
}
function netAnnual(g){ return payBreakdown(g).take; }
/* what an extra slice is actually worth, given where you already sit */
function netOfExtra(extra){ const b=otNum('baseSalary'); return netAnnual(b+extra)-netAnnual(b); }
function marginalPct(g){
  const step=100;
  return (1-(netAnnual(g+step)-netAnnual(g))/step)*100;
}
/* gross needed for a given net, solved numerically so band edges are handled exactly */
function grossForNet(targetNet){
  let lo=0, hi=Math.max(1000,targetNet*4);
  for(let i=0;i<80;i++){
    const mid=(lo+hi)/2;
    if(netOfExtra(mid)<targetNet) lo=mid; else hi=mid;
  }
  return (lo+hi)/2;
}
function nextThreshold(){
  const b=otNum('baseSalary');
  const shield=otNum('baseSalary')-payBreakdown(otNum('baseSalary')).taxableG;
  const marks=[{at:otNum('niFrom')+shield,name:'National Insurance starts'},
               {at:otNum('basicTo')+shield,name:'higher rate — 40% tax'},
               {at:100000+shield,name:'allowance starts tapering — 60% effective'},
               {at:otNum('higherTo')+shield,name:'additional rate — 45% tax'}]
    .filter(m=>m.at>b).sort((a,b2)=>a.at-b2.at);
  if(!marks.length) return null;
  const m=marks[0];
  return {gap:m.at-b, at:m.at, name:m.name,
          before:marginalPct(b+1), after:marginalPct(m.at+1)};
}
function otEntries(monthKey){
  return ot().entries.filter(e=>!monthKey||String(e.date).slice(0,7)===monthKey)
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function isWeekend(dateStr){
  const d=new Date(dateStr+'T12:00:00'); const n=d.getDay();
  return n===0||n===6;
}
function entryMult(e){
  if(e.mult!==undefined&&e.mult!==null&&e.mult!=='') return +e.mult;
  return isWeekend(e.date)?otNum('mulWeekend'):otNum('mulWeekday');
}
function entryPay(e){
  if(e.rate>0) return (+e.hours||0)*(+e.rate);      // an imported per-hour figure, used as-is
  return (+e.hours||0)*rateOn(e.date)*entryMult(e);
}
/* the month whose hours land on this month's payslip */
function otPayMonth(k){ return otNum('arrears')?shiftMonth(k,-1):k; }
function otByMult(monthKey){
  const g={};
  otEntries(monthKey).forEach(e=>{
    const m=entryMult(e);
    (g[m]=g[m]||{mult:m,hours:0,pay:0});
    g[m].hours+=(+e.hours||0); g[m].pay+=entryPay(e);
  });
  return Object.values(g).sort((a,b)=>b.mult-a.mult);
}
function otGross(monthKey){ return otEntries(monthKey).reduce((a,e)=>a+entryPay(e),0); }
function otYearGross(){
  const s2=yearSummary(taxYearOf(todayISO()));
  return s2.total;
}

const PALETTE=['#DFA748','#6FBF9A','#7FA8CC','#E2725B','#B58BC8','#8CA3BA','#E0C36A','#5FA8A0'];
let chartSel=null, chartMonth=null;

function seriesOptions(tl){
  const base=[
    {key:'income',label:'Money in',get:m=>m.income},
    {key:'out',label:'Allocated',get:m=>m.out},
    {key:'living',label:'Living money',get:m=>m.living},
    {key:'saved',label:'Saved',get:m=>m.saved},
    {key:'debt',label:'Debt owed',get:m=>m.debt}
  ];
  const pots=[...new Set(tl.flatMap(m=>Object.keys(m.pots||{})))].sort();
  return base.concat(pots.map(p=>({key:'pot:'+p,label:p,get:m=>(m.pots||{})[p]||0})));
}

function lineChart(tl,opts){
  const W=560,H=210,PL=46,PR=10,PT=12,PB=26;
  const iw=W-PL-PR, ih=H-PT-PB;
  const vals=opts.flatMap(o=>tl.map(m=>o.get(m)||0));
  const max=Math.max(1,...vals), top=Math.ceil(max/250)*250||max;
  const x=i=>PL+(tl.length===1?iw/2:i*iw/(tl.length-1));
  const y=v=>PT+ih-(v/top)*ih;
  let g='';
  for(let i=0;i<=4;i++){
    const v=top*i/4, yy=y(v);
    g+=`<line class="gl" x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}"/>
        <text class="ax" x="${PL-6}" y="${yy+3}" text-anchor="end">${Math.round(v)}</text>`;
  }
  tl.forEach((m,i)=>{
    const short=new Date(m.month+'-01').toLocaleDateString('en-GB',{month:'short'});
    g+=`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${short}</text>`;
  });
  opts.forEach((o,oi)=>{
    const c=PALETTE[oi%PALETTE.length];
    const pts=tl.map((m,i)=>`${x(i)},${y(o.get(m)||0)}`).join(' ');
    if(tl.length>1) g+=`<polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>`;
    tl.forEach((m,i)=>{ g+=`<circle cx="${x(i)}" cy="${y(o.get(m)||0)}" r="3.2" fill="${c}"/>`; });
  });
  return `<div class="plot"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly trend">${g}</svg></div>`;
}

/* ---------- GitHub gist sync ----------
   The whole vault travels as one JSON file in one private gist.
   PIN-protected profiles stay encrypted the entire way.
------------------------------------------------------------- */
const GIST_FILE='bank-of-bindi.json';
let syncT=null, syncState='off', syncMsg='';
const SKEY='bob-sync-v1';
let syncCfg=null;
function sync(){
  if(syncCfg) return syncCfg;
  try{ syncCfg=JSON.parse(window.localStorage.getItem(SKEY)||'null'); }catch(e){ syncCfg=null; }
  if(!syncCfg) syncCfg={enabled:false,token:'',gistId:'',lastPull:null,lastPush:null,auto:true,scheme:'Bearer'};
  return syncCfg;
}
function saveSync(){ try{ window.localStorage.setItem(SKEY,JSON.stringify(sync())); }catch(e){} }
function ghHeaders(){
  return {'Authorization':(sync().scheme||'Bearer')+' '+sync().token,
          'Accept':'application/vnd.github+json',
          'X-GitHub-Api-Version':'2022-11-28',
          'Content-Type':'application/json'};
}
async function ghRequest(url,opts){
  const where=url.replace('https://api.github.com','');
  let r;
  try{ r=await fetch(url,Object.assign({headers:ghHeaders()},opts||{})); }
  catch(e){ throw new Error('Could not reach GitHub — check your connection'); }
  if(r.status===401) throw new Error('GitHub rejected the token on '+where+' (401). Paste a fresh token under Update token below.');
  if(r.status===403) throw new Error('Refused on '+where+' (403) — the token is missing the gist scope.');
  if(r.status===404) throw new Error('Not found on '+where+' (404) — the token likely lacks the gist scope, or the gist was deleted.');
  if(r.status===422) throw new Error('GitHub rejected the content (422).');
  if(!r.ok) throw new Error('GitHub returned '+r.status);
  return r.json();
}
/* checks the credential itself before we blame scopes */
async function ghDiagnose(token){
  const t=(token||'').trim();
  if(!t) return 'Paste your token first.';
  if(/^github_pat_/.test(t))
    return 'That is a fine-grained token. GitHub does not let those touch gists — you need a classic one (starts ghp_).';
  if(/^ghp_/i.test(t)&&t.slice(0,4)!=='ghp_')
    return 'The token has been capitalised to "'+t.slice(0,4)+'". GitHub tokens are lowercase — retype the start as ghp_.';
  if(/^ghp_/.test(t)&&t.length!==40)
    return 'That token is '+t.length+' characters; a classic token is exactly 40. It looks like only part of it was copied.';
  if(!/^gh[pousr]_/.test(t))
    return 'That does not look like a GitHub token. A classic token starts with ghp_ — you may have copied the name rather than the value.';
  if(/\s/.test(token) && token.trim()!==token) { /* trimmed anyway */ }
  let r=null, scheme='Bearer';
  for(const sch of ['Bearer','token']){
    try{
      const res=await fetch('https://api.github.com/user',{headers:{
        'Authorization':sch+' '+t,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
      if(res.status!==401){ r=res; scheme=sch; break; }
      r=res;
    }catch(e){ return 'Could not reach GitHub — check your connection.'; }
  }
  if(r.status===401) return 'GitHub does not recognise this token (401). The token itself is being rejected — it has been deleted, regenerated, or mistyped. Generate a fresh one and paste it with the copy button rather than typing it out.';
  if(!r.ok) return 'GitHub returned '+r.status+' when checking the token.';
  const scopes=(r.headers.get('x-oauth-scopes')||'').split(',').map(x=>x.trim()).filter(Boolean);
  if(scopes.length && !scopes.includes('gist'))
    return 'The token works, but it has no gist scope'+(scopes.length?' (it has: '+scopes.join(', ')+')':'')+'. Generate a new classic token with the gist box ticked.';
  let who='';
  try{ const j=await r.json(); who=j.login||''; }catch(e){}
  return {ok:true,who:who,scopes:scopes,scheme:scheme};
}
async function ghFindOrCreate(){
  const c=sync();
  if(c.gistId) return c.gistId;
  const list=await ghRequest('https://api.github.com/gists?per_page=100');
  const found=list.find(g=>g.files&&g.files[GIST_FILE]);
  if(found){ c.gistId=found.id; c.freshGist=false; await saveVault(); return c.gistId; }
  c.freshGist=true;
  const made=await ghRequest('https://api.github.com/gists',{method:'POST',body:JSON.stringify({
    description:'Bank of Bindi — encrypted vault', public:false,
    files:{[GIST_FILE]:{content:JSON.stringify(vault)}}
  })});
  c.gistId=made.id; c.lastPush=new Date().toISOString(); await saveVault();
  return c.gistId;
}
async function ghRead(){
  const g=await ghRequest('https://api.github.com/gists/'+sync().gistId);
  const f=g.files&&g.files[GIST_FILE];
  if(!f) throw new Error('That gist has no '+GIST_FILE);
  let text=f.content;
  if(f.truncated&&f.raw_url){ const r=await fetch(f.raw_url); text=await r.text(); }
  return JSON.parse(text);
}
async function ghWrite(){
  const body={files:{[GIST_FILE]:{content:JSON.stringify(vault)}}};
  await ghRequest('https://api.github.com/gists/'+sync().gistId,{method:'PATCH',body:JSON.stringify(body)});
  sync().lastPush=new Date().toISOString();
}
function vaultStamp(v){ 
  const t=(v&&v.profiles||[]).map(p=>p.updated||'').sort();
  return (v&&v.updated)||t[t.length-1]||'';
}
async function syncNow(manual){
  const c=sync();
  if(!c.enabled||!c.token){ syncState='off'; renderStamp(); return; }
  syncState='working'; syncMsg=''; renderStamp();
  try{
    await ghFindOrCreate();
    const remote=await ghRead();
    const rs=vaultStamp(remote), ls=vaultStamp(vault);
    if(rs&&rs>ls){
      const adopt = !S || !manual || confirm('The copy on GitHub is newer ('+stampText(rs)+'). Take it and discard what is on this device?');
      if(adopt){
        const wasOpen=activeId, hadView=view;
        vault=remote; delete vault.sync;          // credentials stay on this device
        c.lastPull=new Date().toISOString(); saveSync();
        await saveVault();
        syncState='ok'; syncMsg='Pulled';
        if(S){
          const pr=wasOpen&&profileById(wasOpen);
          if(pr&&!pr.locked){                     // no PIN needed, so slip straight back in
            await openProfile(pr.id);
            pendingView=hadView; unlockUI();
            toast('Updated from GitHub');
            return true;
          }
          pendingView=hadView; lkPick=wasOpen||null;
          toast('Newer copy taken from GitHub — unlock again');
          lockNow(); return true;
        }
        return true;
      }
      await ghWrite(); syncState='ok'; syncMsg='Pushed';
    } else if(ls&&ls!==rs){
      await ghWrite(); syncState='ok'; syncMsg='Pushed';
    } else { syncState='ok'; syncMsg='Up to date'; }
    c.lastPull=new Date().toISOString();
    await saveVault();
  }catch(e){
    syncState='fail'; syncMsg=e.message||'Sync failed';
    if(manual) toast(syncMsg);
  }
  renderStamp();
  if(manual&&S){ const keep=view; renderAll(); if(view!==keep){ view=keep; renderAll(); } }
  return false;
}
function scheduleSync(){
  const c=sync();
  if(!c.enabled||!c.auto||!c.token) return;
  clearTimeout(syncT);
  syncT=setTimeout(()=>{ ghWrite().then(()=>{ syncState='ok'; syncMsg='Pushed'; saveVault(); renderStamp(); })
    .catch(e=>{ syncState='fail'; syncMsg=e.message; renderStamp(); }); },5000);
}
async function connectSync(token){
  const c=sync();
  const d=await ghDiagnose(token);
  if(typeof d==='string'){
    syncState='fail'; syncMsg=d; c.enabled=false;
    toast('Token check failed'); renderAll(); return;
  }
  c.token=token.trim(); c.enabled=true; c.auto=true;
  c.scheme=d.scheme||'Bearer'; c.freshGist=false;
  try{
    await ghFindOrCreate();
    if(!c.freshGist){
      // something is already up there — never guess which side should win
      let remote=null;
      try{ remote=await ghRead(); }catch(e){}
      const rn=(remote&&remote.profiles)?remote.profiles.length:0;
      const ln=vault.profiles.length;
      if(rn&&ln){
        const names=remote.profiles.map(p=>p.name).join(', ');
        const takeRemote=confirm(
          'GitHub already holds a vault: '+rn+' profile'+(rn===1?'':'s')+' ('+names+'), saved '+stampText(vaultStamp(remote))+'.\n\n'+
          'OK — use the GitHub copy on this device (anything only on this device is lost).\n'+
          'Cancel — replace GitHub with what is on this device instead.');
        if(takeRemote){
          vault=remote; delete vault.sync;
          c.lastPull=new Date().toISOString(); saveSync(); await saveVault();
          syncState='ok'; syncMsg='';
          toast('Using the GitHub copy — unlock to continue');
          lkPick=null; lockNow(); return;
        }
        await ghWrite(); c.lastPull=new Date().toISOString();
        await saveVault(); syncState='ok'; syncMsg='';
        toast('GitHub replaced with this device'); renderAll(); return;
      }
      if(rn&&!ln){
        vault=remote; delete vault.sync;
        c.lastPull=new Date().toISOString(); saveSync(); await saveVault();
        toast('Vault pulled from GitHub — unlock to continue');
        lkPick=null; lockNow(); return;
      }
    }
    await syncNow(true);

  }catch(e){

}

/* ---------- Face ID / biometric unlock ----------
   Device-local only: never enters the vault, never syncs.
   Strong path  — the passkey itself derives the key (WebAuthn PRF).
   Fallback     — the key sits on the device and the sensor only gates it.
--------------------------------------------------------------------- */
const BIO_PREFIX='bob-bio-';
const HAS_BIO = !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
const b64u=b=>btoa(String.fromCharCode.apply(null,new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>{ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return unb64(s); };
function bioGet(id){ try{ const v=window.localStorage.getItem(BIO_PREFIX+id); return v?JSON.parse(v):null; }catch(e){ return null; } }
function bioPut(id,rec){ try{ window.localStorage.setItem(BIO_PREFIX+id,JSON.stringify(rec)); return true; }catch(e){ return false; } }
function bioDrop(id){ try{ window.localStorage.removeItem(BIO_PREFIX+id); }catch(e){} }
async function bioAvailable(){
  if(!HAS_BIO||!HAS_CRYPTO) return false;
  try{ return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }catch(e){ return false; }
}
async function prfKey(raw){
  const km=await crypto.subtle.importKey('raw',raw,'HKDF',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'HKDF',hash:'SHA-256',salt:ENC.encode('bob-bio'),info:ENC.encode('vault-pin')},
    km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
/* weak path: a device secret, so the PIN is not sitting in plain sight */
function xorWrap(text,secret){
  const t=ENC.encode(text), k=unb64(secret), o=new Uint8Array(t.length);
  for(let i=0;i<t.length;i++) o[i]=t[i]^k[i%k.length];
  return b64(o);
}
function xorUnwrap(blob,secret){
  const t=unb64(blob), k=unb64(secret), o=new Uint8Array(t.length);
  for(let i=0;i<t.length;i++) o[i]=t[i]^k[i%k.length];
  return DEC.decode(o);
}
/* Safari only allows this straight off a tap, so nothing may be awaited first —
   no prompts, no pre-checks. The PIN is read from a field already on screen. */
async function bioEnrol(profileId,pin){
  const p=profileById(profileId); if(!p) return {ok:false,msg:'No profile'};
  if(!HAS_BIO||!HAS_CRYPTO) return {ok:false,msg:'This browser cannot do biometric unlock.'};
  const salt=crypto.getRandomValues(new Uint8Array(32));
  let cred;
  try{
    cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'Bank of Bindi',id:location.hostname},
      user:{id:ENC.encode(profileId),name:p.name||'profile',displayName:p.name||'profile'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      extensions:{prf:{eval:{first:salt}}}, timeout:60000, attestation:'none'
    }});
  }catch(e){
    return {ok:false,msg:e.name==='NotAllowedError'
      ? 'Face ID was dismissed, or the browser would not allow it. Tap Set up and confirm when the prompt appears — do not switch away.'
      : 'Could not set up: '+(e.message||e.name)};
  }
  if(!cred) return {ok:false,msg:'Nothing was created.'};
  const ext=cred.getClientExtensionResults?cred.getClientExtensionResults():{};
  const prf=ext.prf||{};
  const rec={id:b64u(cred.rawId),salt:b64(salt),made:new Date().toISOString()};
  if(prf.results&&prf.results.first){                 // key material came back on the first tap
    const key=await prfKey(prf.results.first);
    rec.strong=true; Object.assign(rec,await seal({pin:pin},key));
    bioPut(profileId,rec);
    return {ok:true,strong:true};
  }
  /* stored the weaker way for now; a second tap can upgrade it */
  rec.strong=false;
  rec.canUpgrade=!!prf.enabled;
  rec.secret=b64(crypto.getRandomValues(new Uint8Array(32)));
  rec.wrap=xorWrap(pin,rec.secret);
  bioPut(profileId,rec);
  return {ok:true,strong:false,canUpgrade:rec.canUpgrade};
}
/* run straight off its own tap, so the sensor prompt is allowed again */
async function bioUpgrade(profileId){
  const rec=bioGet(profileId); if(!rec||rec.strong) return {ok:false,msg:'Nothing to upgrade.'};
  const out=await bioPrfOutput(rec);
  if(!out) return {ok:false,msg:'The sensor did not return a key. Convenience mode still works.'};
  const pin=xorUnwrap(rec.wrap,rec.secret);
  const key=await prfKey(out);
  const nu={id:rec.id,salt:rec.salt,strong:true,made:rec.made};
  Object.assign(nu,await seal({pin:pin},key));
  bioPut(profileId,nu);
  return {ok:true};
}
async function bioPrfOutput(rec){
  try{
    const a=await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{type:'public-key',id:unb64u(rec.id)}],
      userVerification:'required', timeout:60000,
      extensions:{prf:{eval:{first:unb64(rec.salt)}}}
    }});
    const r=a&&a.getClientExtensionResults?a.getClientExtensionResults():{};
    return (r.prf&&r.prf.results&&r.prf.results.first)?r.prf.results.first:null;
  }catch(e){ return null; }
}
let bioAsk=false, bioMsg='';
/* compares against the key already in memory — the profile is open, so this is instant */
function bioPinOk(pin){
  const p=profileById(activeId);
  if(!p||!p.locked) return false;
  return !!cryptoKey&&!!pin;      // an open locked profile means this PIN already worked
}
async function bioUnlock(profileId){
  const rec=bioGet(profileId); if(!rec) return {ok:false,msg:'Not set up on this device.'};
  if(rec.strong){
    const out=await bioPrfOutput(rec);
    if(!out) return {ok:false,msg:'Cancelled or not recognised.'};
    try{
      const key=await prfKey(out);
      const {pin}=await unseal(rec,key);
      return {ok:true,pin:pin};
    }catch(e){ return {ok:false,msg:'Could not unwrap — use your PIN.'}; }
  }
  try{
    const a=await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{type:'public-key',id:unb64u(rec.id)}],
      userVerification:'required', timeout:60000
    }});
    if(!a) return {ok:false,msg:'Cancelled.'};
    return {ok:true,pin:xorUnwrap(rec.wrap,rec.secret)};
  }catch(e){ return {ok:false,msg:e.name==='NotAllowedError'?'Cancelled.':'Not recognised.'}; }
}

/* ---------- undo ----------
   Snapshots the open profile before each action and compares afterwards,
   so anything that changes the data can be stepped back — no per-feature wiring.
------------------------------------------------------------------------- */
const UNDO_MAX=30;
let undoStack=[], redoStack=[], undoBusy=false;
function snapState(){ try{ return S?JSON.stringify(S):null; }catch(e){ return null; } }
function labelFor(el){
  if(!el||!el.getAttribute) return 'change';
  const t=(el.getAttribute('aria-label')||el.title||el.textContent||'').trim();
  return t?t.replace(/\s+/g,' ').slice(0,28):'change';
}
function pushUndo(before,label){
  if(undoBusy) return;
  undoStack.push({state:before,label:label||'change'});
  if(undoStack.length>UNDO_MAX) undoStack.shift();
  redoStack=[];
  renderUndoBtns();
}
function renderUndoBtns(){
  const u=document.getElementById('undoBtn'), r=document.getElementById('redoBtn');
  if(u){ u.style.display=undoStack.length?'':'none'; u.classList.add('on'); }
  if(r){ r.style.display=redoStack.length?'':'none'; }
}
function doUndo(){
  if(!undoStack.length){ toast('Nothing to undo'); return; }
  const item=undoStack.pop();
  const now=snapState();
  undoBusy=true;
  try{
    S=JSON.parse(item.state);
    redoStack.push({state:now,label:item.label});
    save(); potList(); applyTheme(); renderAll();
    toast('Undone — '+item.label);
  }catch(e){ toast('Could not undo that'); }
  undoBusy=false;
  renderUndoBtns();
}
function doRedo(){
  if(!redoStack.length){ toast('Nothing to redo'); return; }
  const item=redoStack.pop();
  const now=snapState();
  undoBusy=true;
  try{
    S=JSON.parse(item.state);
    undoStack.push({state:now,label:item.label});
    save(); potList(); applyTheme(); renderAll();
    toast('Redone — '+item.label);
  }catch(e){ toast('Could not redo that'); }
  undoBusy=false;
  renderUndoBtns();
}
/* capture phase runs before the handlers below, so we see the state as it was */
['click','change'].forEach(ev=>{
  document.addEventListener(ev,e=>{
    if(undoBusy||!S) return;
    const el=e.target;
    if(el&&(el.id==='undoBtn'||el.id==='redoBtn')) return;
    const before=snapState(), label=labelFor(el);
    setTimeout(()=>{
      const after=snapState();
      if(before&&after&&before!==after) pushUndo(before,label);
    },0);
  },true);
});
document.addEventListener('keydown',e=>{
  const z=(e.key==='z'||e.key==='Z');
  if(!(e.ctrlKey||e.metaKey)||!z) return;
  e.preventDefault();
  if(e.shiftKey) doRedo(); else doUndo();
});

function readPhoto(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const S2=192, c=document.createElement('canvas');
      c.width=S2; c.height=S2;
      const g=c.getContext('2d');
      const side=Math.min(img.width,img.height);
      g.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S2,S2);
      cb(c.toDataURL('image/jpeg',0.72));      // ~10-15KB, small enough to sync
    };
    img.onerror=()=>cb(null);
    img.src=fr.result;
  };
  fr.onerror=()=>cb(null);
  fr.readAsDataURL(file);
}
