    <div class="row-btns">
      <button class="btn ghost" id="addProfile">Add a profile</button>
      <button class="btn ghost" id="lockBtn">Lock now</button>
    </div>
    <p class="note">A PIN encrypts the figures with a key made from the PIN itself, which is never stored. That means a lost PIN is a lost profile — there is no way back in, by design.</p>`;
  }

  if(setTab==='sync'){
    const c=sync();
    if(!c.enabled||!c.token){
      h+=`<p class="note">Sync keeps every device on the same copy by parking your vault in one private GitHub gist. PIN-protected profiles travel encrypted — GitHub only ever holds ciphertext.</p>
      <div class="grouphead">Setting it up</div>
      <div class="card"><ol class="note" style="padding-left:18px;line-height:1.9;margin:0">
        <li>Sign in at <b>github.com</b>.</li>
        <li>Go to Settings → Developer settings → Personal access tokens → <b>Tokens (classic)</b>.</li>
        <li>Generate new token (classic). Tick the box marked <b>gist</b> — this is the only one that matters. <b>repo</b> does not include gists.</li>
        <li>Set expiration to <b>No expiration</b>, or you will be doing this again in a year.</li>
        <li>Copy the token and paste it below. You cannot see it again after you leave that page.</li>
      </ol></div>
      <div class="card">
        <label class="f"><span>Token</span>
          <input type="text" id="ghToken" placeholder="ghp_…" spellcheck="false"
            autocomplete="off" autocorrect="off" autocapitalize="none"
            name="bob-gh-field" style="font-family:var(--mono);font-size:12px"></label>
        <div class="note" id="ghLen" style="margin-top:6px">A classic token is exactly 40 characters: ghp_ plus 36 more.</div>
        <div class="row-btns">
          <button class="btn ghost" id="ghTest">Test token</button>
          <button class="btn" id="ghConnect">Connect</button>
        </div>
        ${syncMsg?`<div class="alert" style="margin-top:12px;margin-bottom:0"><b>Sync could not connect</b><br>${esc(syncMsg)}</div>`:''}
      </div>
      <p class="note">It has to be a classic token — GitHub's fine-grained tokens cannot touch gists. Ticking only <b>gist</b> means the token can do nothing else to your account.</p>`;
    } else {
      h+=`<div class="card">
        ${srow('Sync', syncState==='fail'?('Failing — '+esc(syncMsg)):syncState==='working'?'Working…':'Connected to GitHub.',
          `<input type="text" value="${syncState==='fail'?'Error':'On'}" readonly>`)}
        ${srow('Gist','The private gist holding your vault.',`<input type="text" value="${esc((c.gistId||'').slice(0,10))}…" readonly>`)}
        ${srow('Last pulled','When this device last checked GitHub.',`<input type="text" value="${stampText(c.lastPull)}" readonly>`)}
        ${srow('Last pushed','When this device last sent changes up.',`<input type="text" value="${stampText(c.lastPush)}" readonly>`)}
        ${srow('Sync automatically','Sends changes up a few seconds after you make them.',sw2('auto',c.auto))}
      </div>
      <div class="row-btns">
        <button class="btn" id="ghSync">Sync now</button>
        <button class="btn ghost danger" id="ghOff">Disconnect</button>
      </div>
      ${syncState==='fail'?`<div class="alert"><b>Last sync failed</b><br>${esc(syncMsg)}</div>`:''}
      <div class="grouphead">Update token</div>
      <div class="card">
        <label class="f"><span>Paste a new token to replace the stored one</span>
          <input type="text" id="ghToken2" placeholder="ghp_…" spellcheck="false"
            autocomplete="off" autocorrect="off" autocapitalize="none"
            style="font-family:var(--mono);font-size:12px"></label>
        <div class="row-btns"><button class="btn ghost" id="ghReplace">Replace token</button></div>
        <div class="note">Tokens live on this device only now — each device needs its own. Replacing one here does not affect the other.</div>
      </div>
      <div class="grouphead">Gist</div>
      <div class="card">
        <label class="f"><span>Gist id — paste one to point this device at a specific gist</span>
          <input type="text" id="ghGist" value="${esc(c.gistId||'')}" spellcheck="false"
            autocomplete="off" autocapitalize="none" style="font-family:var(--mono);font-size:12px"></label>
        <div class="row-btns"><button class="btn ghost" id="ghSetGist">Use this gist</button></div>
        <div class="note">If your devices ended up with separate gists, put the same id on both and they will meet in the middle.</div>
      </div>
      <p class="note">On opening, whichever copy is newer wins. If GitHub has the newer one while you are working, it asks before replacing what is on this device. Disconnecting leaves the gist untouched — your data stays local and nothing is deleted.</p>`;
    }
  }

  if(setTab==='data'){
    const m=S.meta||{};
    h+=`<div class="card">
      ${srow('This device','Named so you can tell which backup is which.',
        `<input type="text" id="devName2" value="${esc(deviceName())}">`)}
      ${srow('Storing in',STORE==='claude'?'Claude. Download the file to run it on a phone.':STORE==='device'?'This device only. Nothing leaves it.':'Memory only. Back up before closing.',
        `<input type="text" value="${STORE==='claude'?'Claude':STORE==='device'?deviceName():'Memory'}" readonly>`)}
      ${srow('Last saved',esc(m.savedOn||'—'),`<input type="text" value="${stampText(m.lastSaved)}" readonly>`)}
      ${srow('Last backup','Do this before switching devices.',`<input type="text" value="${stampText(m.lastBackup)}" readonly>`)}
      ${srow('App version','If this is not the build you just uploaded, pull down to refresh twice — the service worker updates on the next load.',
        `<input type="text" value="Build ${BUILD}" readonly>`)}
      ${srow('Install files','Checks the icons, manifest and worker are actually reachable.',
        `<button class="btn ghost" id="checkInstall">Check</button>`)}
      ${srow('Installed app','Add to Home Screen from your browser menu for a full-screen icon with no address bar.',
        `<input type="text" value="${(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone?'Running installed':'Running in browser'}" readonly>`)}
    </div>
    <div class="row-btns">
      <button class="btn" id="exportVault">Back up all profiles</button>
      <button class="btn ghost" id="exportJson2">Back up this profile</button>
      <button class="btn ghost" id="importJson2">Restore a backup</button>
      <button class="btn ghost" id="exportCsv2">Transfer list for Excel</button>
    </div>
    <div class="grouphead">Starting over</div>
    <div class="card">
      ${srow('Clear the month record','Deletes closed-month history and the graphs. Rules and balances stay.',
        `<button class="btn ghost danger" id="wipeHistory">Clear</button>`)}
      ${srow('Empty the app','Removes every income, bill, debt and event so you can build it from scratch.',
        `<button class="btn ghost danger" id="wipeAll">Empty</button>`)}
      ${srow('Back to the sample','Restores the figures this was first built with.',
        `<button class="btn ghost danger" id="resetSeed">Reset</button>`)}
    </div>
    <p class="note">Back up first — these three cannot be undone from inside the app.</p>`;
  }
  document.getElementById('tab-set').innerHTML=h;
}

/* ---------- render: CLOSE MONTH ---------- */
function renderClose(){
  const rec=mrec(S.current);
  let h=`<p class="note">Month end: open each account, type in the real balance. Anything that doesn't match tells you something — a missed payment, extra spending, or interest you weren't counting on.</p>`;
  S.debts.forEach(d=>{
    const p=amountOf(d), int=(+d.balance||0)*(+d.apr||0)/100/12;
    const expected=Math.max(0,(+d.balance||0)+int-p);
    const actual=rec.actuals[d.id];
    const has=actual!==undefined&&actual!==null&&actual!=='';
    const v=has?(+actual-expected):0;
    h+=`<div class="rec">
      <div class="hdr"><b>${esc(d.name)}</b><span class="note">${(+d.apr||0).toFixed(1)}% APR</span></div>
      <div class="recgrid">
        <div><span>Opened at</span><b>${gbp(d.balance)}</b></div>
        <div><span>Paid</span><b>−${gbp(p)}</b></div>
        <div><span>Interest</span><b>+${gbp(int)}</b></div>
        <div><span>Should be</span><b>${gbp(expected)}</b></div>
        <div><label class="f"><span>Actually is £</span>
          <input type="number" step="0.01" value="${has?actual:''}" placeholder="—" data-actual="${d.id}"></label></div>
        <div><span>Difference</span><b class="${!has?'':(Math.abs(v)<1?'var-ok':'var-bad')}">${has?(v>0?'+':'')+gbp(v):'—'}</b></div>
      </div>
    </div>`;
  });
  const r=buildRun();
  h+=`<div class="grouphead">Month summary<em>${monthName(S.current)}</em></div>
  <div class="stats">
    <div class="stat"><div class="k">In</div><div class="v">${gbp(r.income)}</div></div>
    <div class="stat"><div class="k">Allocated</div><div class="v">${gbp(r.allocated)}</div></div>
    <div class="stat"><div class="k">Left over</div><div class="v" style="color:var(--live)">${gbp(r.living)}</div></div>
  </div>
  <div class="row-btns">
    <button class="btn ghost" id="savePdf2">Save statement as PDF</button>
    <button class="btn" id="closeMonth">Close ${monthName(S.current)} and roll forward</button>
  </div>
  <p class="note">Rolling forward copies every rule into next month, moves your real balances across, clears the ticks, and files this month in the record below.</p>`;

  if(S.history.length){
    h+=`<div class="grouphead">Record</div><table class="hist">
      <tr><th>Month</th><th>In</th><th>Out</th><th>Saved</th><th>Debt</th></tr>`+
      S.history.slice().reverse().map(x=>`<tr><td>${monthName(x.month)}</td><td>${gbp(x.income)}</td><td>${gbp(x.out)}</td><td>${gbp(x.saved)}</td><td>${gbp(x.debt)}</td></tr>`).join('')+
      `</table>`;
  }
  document.getElementById('tab-close').innerHTML=h;
}

/* ---------- helpers ---------- */
function esc(s){return String(s??'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
const NAV_PERSONAL=[['run','Run'],['in','Money in'],['out','Outgoings'],['events','Coming up'],
  ['debt','Debts'],['ot','Overtime'],['trend','Trends'],['close','Close month'],['set','Settings']];
const NAV_JOINT=[['plans','Plans'],['who','Who pays'],['time','Commitments'],['set','Settings']];
function renderNav(){
  const list=isJoint()?NAV_JOINT:NAV_PERSONAL;
  if(!list.some(x=>x[0]===view)) view=list[0][0];
  document.getElementById('nav').innerHTML=list.map(([k,l])=>
    `<button role="tab" data-tab="${k}" aria-selected="${view===k}">${l}</button>`).join('');
  ['run','in','out','events','debt','ot','trend','close','set','plans','who','time'].forEach(k=>{
    const el=document.getElementById('tab-'+k);
    if(el) el.classList.toggle('hidden',view!==k);
  });
}
function renderAll(){
  if(!S) return;
  if(isJoint()){
    document.getElementById('monthLabel').textContent=S.settings&&S.settings.appName?S.settings.appName:'Joint plans';
    renderPlans(); renderWho(); renderTime(); renderSet(); renderNav(); renderStamp();
    return;
  }
  document.getElementById('monthLabel').textContent=monthName(S.current);
  ['prevM','nextM'].forEach(id=>{ const e=document.getElementById(id); if(e) e.style.display=isJoint()?'none':''; });
  const sb=document.getElementById('syncBtn');
  if(sb){
    sb.style.display=sync().enabled?'':'none';
    sb.style.color=syncState==='fail'?'var(--warn)':syncState==='working'?'var(--mute)':'var(--brass)';
    sb.style.borderColor=syncState==='fail'?'var(--warn)':'var(--line)';
  }
  renderRun(); renderIn(); renderOut(); renderEvents(); renderDebt(); renderOt(); renderTrend(); renderClose(); renderSet();
  renderNav(); renderStamp();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-series]')||e.target;
  if(t.dataset&&t.dataset.series){
    if(!chartSel) chartSel=new Set();
    chartSel.has(t.dataset.series)?chartSel.delete(t.dataset.series):chartSel.add(t.dataset.series);
    renderTrend(); return;
  }
  if(t.matches('nav button')){ view=t.dataset.tab; renderAll(); return; }
  if(t.id==='prevM'){ S.current=shiftMonth(S.current,-1); save(); renderAll(); return; }
  if(t.id==='nextM'){ S.current=shiftMonth(S.current,1); save(); renderAll(); return; }
  if(t.dataset.tick!==undefined){ const r=mrec(S.current); r.ticks[t.dataset.tick]=t.checked; save(); renderRun(); return; }
  if(t.dataset.recv!==undefined){ const i=S.income.find(x=>x.id===t.dataset.recv); i.received=t.checked; save(); renderAll(); return; }
  if(t.id==='resetTicks'){ mrec(S.current).ticks={}; save(); renderRun(); toast('Ticks cleared'); return; }
  if(t.id==='addIncome'){ S.income.push({id:uid(),name:'New source',amount:0,received:false}); save(); renderAll(); return; }
  if(t.dataset.addgroup){ S.items.push({id:uid(),name:'New item',group:t.dataset.addgroup,mode:'fixed',amount:0,pct:0,base:'all',pot:t.dataset.addgroup==='Savings & investments'?'Invest':'Bills',method:'transfer'}); save(); renderAll(); return; }
  if(t.id==='addOneoff'){ S.oneoffs.push({id:uid(),name:'New one-off',amount:0,month:S.current}); save(); renderAll(); return; }
  if(t.id==='addDebt'){ S.debts.push({id:uid(),name:'New debt',balance:0,apr:0,mode:'fixed',amount:0,pct:0,base:'all',method:'transfer'}); save(); renderAll(); return; }
  if(t.id==='addEvent'){ S.events.push({id:uid(),name:'New event',target:0,saved:0,dueMonth:shiftMonth(S.current,3)}); save(); renderAll(); return; }
  if(t.dataset.delEvent){ S.events=S.events.filter(x=>x.id!==t.dataset.delEvent); save(); renderAll(); return; }
  if(t.id==='importJson'){ document.getElementById('fileIn').click(); return; }
  if(t.dataset.delItem){ S.items=S.items.filter(x=>x.id!==t.dataset.delItem); save(); renderAll(); return; }
  if(t.dataset.delIncome){ S.income=S.income.filter(x=>x.id!==t.dataset.delIncome); save(); renderAll(); return; }
  if(t.dataset.delOneoff){ S.oneoffs=S.oneoffs.filter(x=>x.id!==t.dataset.delOneoff); save(); renderAll(); return; }
  if(t.dataset.delDebt){ S.debts=S.debts.filter(x=>x.id!==t.dataset.delDebt); save(); renderAll(); return; }
  if(t.id==='closeMonth'){ closeMonth(); return; }
  if(t.id==='ghTest'){
    const v=(document.getElementById('ghToken')||{}).value||'';
    ghDiagnose(v).then(d=>{
      if(typeof d==='string'){ syncMsg=d; }
      else{ syncMsg=''; toast('Token is good'+(d.who?' — '+d.who:'')+(d.scopes.length?' · '+d.scopes.join(', '):'')); }
      renderSet();
    });
    return;
  }
  if(t.id==='ghConnect'){
    const v=(document.getElementById('ghToken')||{}).value||'';
    if(!v.trim()){ toast('Paste your token first'); return; }
    connectSync(v); return;
  }
  if(t.id==='ghSync'){ syncNow(true); return; }
  if(t.id==='ghReplace'){
    const v=(document.getElementById('ghToken2')||{}).value||'';
    if(!v.trim()){ toast('Paste a token first'); return; }
    ghDiagnose(v).then(d=>{
      if(typeof d==='string'){ syncState='fail'; syncMsg=d; renderSet(); toast('Token check failed'); return; }
      const c2=sync(); c2.token=v.trim(); c2.scheme=d.scheme||'Bearer'; c2.enabled=true;
      saveSync(); syncState='ok'; syncMsg='';
      toast('Token replaced'+(d.who?' — '+d.who:''));
      syncNow(true);
    });
    return;
  }
  if(t.id==='ghSetGist'){
    const v=(document.getElementById('ghGist')||{}).value||'';
    sync().gistId=v.trim(); saveSync(); toast(v.trim()?'Gist set':'Gist cleared — it will find or make one');
    syncNow(true); return;
  }
  if(t.id==='ghOff'){
    if(!confirm('Disconnect from GitHub? Your data stays on this device and the gist is left alone.')) return;
    vault.sync={enabled:false,token:'',gistId:sync().gistId,lastPull:null,lastPush:null,auto:true};
    syncState='off'; saveVault().then(()=>{ renderAll(); toast('Disconnected'); });
    return;
  }
  if(t.id==='expShare'){ shareFile(); return; }
  if(t.id==='expDl'){ if(!rawDownload(pendingFile.name,pendingFile.text,pendingFile.type)) toast('Blocked here — use Copy instead'); else closeExport(); return; }
  if(t.id==='expCopy'){ copyExport(); return; }
  if(t.id==='expClose'){ closeExport(); return; }
  // lock screen
  const person=t.closest&&t.closest('[data-open]');
  if(person){ lkPick=person.dataset.open; lkMsg=''; renderLock(); return; }
  if(t.id==='lkOpen'){ tryOpen(); return; }
  if(t.id==='lkBio'){
    bioUnlock(lkPick).then(async r=>{
      if(!r.ok){ lkMsg=r.msg; renderLock(); return; }
      const o=await openProfile(lkPick,r.pin);
      if(o==='ok') unlockUI();
      else { lkMsg='The stored PIN no longer matches — enter it by hand.'; renderLock(); }
    });
    return;
  }
  if(t.id==='lkCreate'){ doCreate(true); return; }
  if(t.id==='lkNoPin'){ doCreate(false); return; }
  if(t.id==='lkNew'){ lkMode='new'; lkMsg=''; renderLock(); return; }
  if(t.id==='lkBack'){ lkMode='pick'; lkMsg=''; renderLock(); return; }
  if(t.id==='lockBtn'){ lkPick=activeId; lockNow(); return; }
  if(t.id==='syncBtn'){ toast('Syncing…'); syncNow(true); return; }
  // profile management
  if(t.id==='addProfile'){ lkMode='new'; lkMsg=''; lockNow(); return; }
  if(t.id==='bioOn'){
    const pin=prompt('Confirm your PIN to link it to this device.');
    if(pin===null) return;
    openProfile(activeId,pin).then(r=>{
      if(r!=='ok'){ toast('That PIN does not match'); return; }
      bioEnrol(activeId,pin).then(res=>{
        if(!res.ok){ toast(res.msg); return; }
        if(!res.strong){
          alert('Set up, but in convenience mode.\n\nThis device did not offer hardware key derivation, so your PIN is held on this device and the sensor only gates access to it. Someone technical with your unlocked device could retrieve it.\n\nTurn it off in Settings if you would rather not.');
        }
        toast(res.strong?'Face ID on — hardware-backed':'Face ID on — convenience mode');
        renderAll();
      });
    });
    return;
  }
  if(t.id==='bioOff'){
    if(!confirm('Turn off Face ID on this device? Your PIN still works everywhere.')) return;
    bioDrop(activeId); toast('Face ID removed from this device'); renderAll(); return;
  }
  if(t.id==='setPin'){
    const a=prompt('New PIN — at least four characters. There is no reset if you forget it.');
    if(a===null) return;
    if(a.length<4){ toast('Too short'); return; }
    bioDrop(activeId);
    setProfilePin(activeId,a).then(ok=>{ toast(ok?'PIN set — set Face ID up again if you use it':'Could not set a PIN'); renderAll(); });
    return;
  }
  if(t.id==='clearPin'){
    if(!confirm('Remove the PIN? This profile will be readable by anyone with the file.')) return;
    bioDrop(activeId);
    setProfilePin(activeId,'').then(()=>{ toast('PIN removed'); renderAll(); });
    return;
  }
  if(t.dataset&&t.dataset.delprofile){
    const pr=profileById(t.dataset.delprofile); if(!pr) return;
    if(!confirm(`Delete ${pr.name} and everything in it? This cannot be undone.`)) return;
    bioDrop(pr.id);
    vault.profiles=vault.profiles.filter(x=>x.id!==pr.id);
    saveVault().then(()=>{
      if(pr.id===activeId){ lkPick=null; lockNow(); }
      else { renderAll(); toast('Profile deleted'); }
    });
    return;
  }
  if(t.id==='checkInstall'){ checkInstall(); return; }
  if(t.id==='exportVault'){ exportVault(); return; }
  // joint portal
  if(t.id==='addPlan'){ plans().push({id:uid(),name:'New plan',targetDate:'',items:[]}); save(); renderAll(); return; }
  if(t.dataset&&t.dataset.planopen){ openPlan=t.dataset.planopen; claimOn=null; save(); renderAll(); return; }
  if(t.id==='planBack'){ openPlan=null; claimOn=null; renderAll(); return; }
  if(t.dataset&&t.dataset.plandel){
    const pl=planById(t.dataset.plandel);
    if(!pl||!confirm('Delete "'+pl.name+'" and everything in it?')) return;
    S.plans=plans().filter(x=>x.id!==pl.id); if(openPlan===pl.id) openPlan=null;
    save(); renderAll(); return;
  }
  if(t.dataset&&t.dataset.additem){
    const pl=planById(t.dataset.additem); if(!pl) return;
    (pl.items=pl.items||[]).push({id:uid(),name:'New expense',amount:0,dueDate:pl.targetDate||'',claims:[]});
    save(); renderAll(); return;
  }
  if(t.dataset&&t.dataset.itemdel){
    const [pid,iid]=t.dataset.itemdel.split(':');
    const pl=planById(pid); if(!pl) return;
    pl.items=(pl.items||[]).filter(i=>i.id!==iid); save(); renderAll(); return;
  }
  if(t.dataset&&t.dataset.claimopen){ claimOn=t.dataset.claimopen; renderPlans(); return; }
  if(t.id==='claimCancel'){ claimOn=null; renderPlans(); return; }
  if(t.dataset&&t.dataset.claimsave){
    const [pid,iid]=t.dataset.claimsave.split(':');
    const pl=planById(pid); const it=pl&&(pl.items||[]).find(i=>i.id===iid); if(!it) return;
    const who=(document.getElementById('clWho')||{}).value||'';
    const amt=parseFloat((document.getElementById('clAmt')||{}).value||'0');
    const by=(document.getElementById('clBy')||{}).value||'';
    if(!who){ toast('Pick who is covering it'); return; }
    if(!(amt>0)){ toast('Enter an amount'); return; }
    claimsOf(it).push({id:uid(),memberId:who,amount:amt,by:by,paid:false});
    claimOn=null; save(); renderAll();
    const m=memberById(who);
    toast((m?m.name:'Someone')+' committed '+gbp(amt));
    return;
  }
  if(t.dataset&&t.dataset.claimdel){
    const [pid,iid,cid]=t.dataset.claimdel.split(':');
    const pl=planById(pid); const it=pl&&(pl.items||[]).find(i=>i.id===iid); if(!it) return;
    it.claims=claimsOf(it).filter(c=>c.id!==cid); save(); renderAll(); return;
  }
  if(t.dataset&&t.dataset.claimpaid){
    const [pid,iid,cid]=t.dataset.claimpaid.split(':');
    const pl=planById(pid); const it=pl&&(pl.items||[]).find(i=>i.id===iid);
    const c=it&&claimsOf(it).find(x=>x.id===cid); if(!c) return;
    c.paid=t.checked; c.paidOn=t.checked?new Date().toISOString():null;
    save(); renderAll(); return;
  }
  if(t.id==='addMember'){ members().push({id:uid(),name:'New person',colour:PALETTE[members().length%PALETTE.length]}); save(); renderAll(); return; }
  if(t.dataset&&t.dataset.memberdel){
    const m=memberById(t.dataset.memberdel); if(!m) return;
    const t2=memberTotals(m.id);
    if(t2.committed>0&&!confirm(m.name+' has '+gbp(t2.committed)+' committed. Remove them and their commitments?')) return;
    plans().forEach(p=>(p.items||[]).forEach(i=>{ i.claims=claimsOf(i).filter(c=>c.memberId!==m.id); }));
    S.members=members().filter(x=>x.id!==m.id); save(); renderAll(); return;
  }
  if(t.dataset&&t.dataset.ottab){ otTab=t.dataset.ottab; renderOt(); return; }
  if(t.id==='otAdd'){
    const d=(document.getElementById('otDate')||{}).value||'';
    const hrs=parseFloat((document.getElementById('otHours')||{}).value||'0');
    const m=(document.getElementById('otMult')||{}).value||'';
    if(!d){ toast('Pick a date'); return; }
    if(!(hrs>0)){ toast('Enter the hours'); return; }
    ot().entries.push({id:uid(),date:d,hours:hrs,mult:m===''?null:+m});
    save(); renderAll(); toast('Shift added');
    return;
  }
  if(t.dataset&&t.dataset.otdel){
    ot().entries=ot().entries.filter(e=>e.id!==t.dataset.otdel);
    save(); renderAll(); return;
  }
  if(t.dataset&&t.dataset.setsalary){
    S.salaryId=t.dataset.setsalary; save(); renderAll();
    toast('Payslip check moved here'); return;
  }
  if(t.dataset&&t.dataset.settab){ setTab=t.dataset.settab; renderSet(); return; }
  if(t.dataset&&t.dataset.accent){ setSetting('accent',t.dataset.accent); return; }
  if(t.id==='addPot'){ const p=potList(); p.push({name:'New pot',color:PALETTE[p.length%PALETTE.length]}); save(); renderAll(); return; }
  if(t.dataset&&t.dataset.potdel!==undefined){
    const p=potList(), gone=p[+t.dataset.potdel];
    if(!gone) return;
    const others=p.filter(x=>x.name!==gone.name);
    const to=others.length?others[0].name:'Bills';
    S.items.forEach(i=>{ if(i.pot===gone.name) i.pot=to; });
    S.settings.pots=others; save(); renderAll(); toast(`Items moved to ${to}`); return;
  }
  if(t.id==='exportJson2'){ exportJson(); return; }
  if(t.id==='importJson2'){ document.getElementById('fileIn').click(); return; }
  if(t.id==='exportCsv2'){ exportCsv(); return; }
  if(t.id==='wipeHistory'){ S.history=[]; save(); renderAll(); toast('Record cleared'); return; }
  if(t.id==='wipeAll'){
    const cur=S.current, set=S.settings, meta=S.meta;
    S=seed(); S.income=[]; S.items=[]; S.debts=[]; S.oneoffs=[]; S.events=[];
    S.history=[]; S.months={}; S.current=cur; S.settings=set; S.meta=meta;
    save(); renderAll(); toast('Emptied'); return;
  }
  if(t.id==='resetSeed'){ const set=S.settings, meta=S.meta; S=seed(); S.settings=set; S.meta=meta; save(); renderAll(); toast('Sample restored'); return; }
  if(t.id==='savePdf'||t.id==='savePdf2'||t.id==='savePdf3'){ printStatement(); return; }
  if(t.id==='exportCsv'){ exportCsv(); return; }
  if(t.id==='exportJson'){ exportJson(); return; }
});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='ghToken'){
    const el=document.getElementById('ghLen'); if(!el) return;
    const v=e.target.value, t=v.trim();
    const bits=[];
    bits.push(t.length+' characters'+(t.length===40?' ✓':t.length?' — expected 40':''));
    if(t&&!/^ghp_/.test(t)){
      bits.push(/^Ghp_/i.test(t)&&t.slice(0,4)!=='ghp_'
        ? 'starts "'+t.slice(0,4)+'" — the keyboard has capitalised it, it must be lowercase ghp_'
        : /^github_pat_/.test(t) ? 'that is a fine-grained token, which cannot use gists'
        : 'should start ghp_');
    }
    if(v!==t) bits.push('has spaces around it — those get stripped');
    el.textContent=bits.join(' · ');
    el.style.color=(t.length===40&&/^ghp_/.test(t))?'var(--live)':'var(--mute)';
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const id=e.target&&e.target.id;
  if(id==='lkPin'){ tryOpen(); }
  else if(id==='lkPin1'||id==='lkPin2'||id==='lkName'){ doCreate(true); }
});
document.addEventListener('change',e=>{
  const t=e.target, f=t.dataset.f;
  if(t.dataset.actual!==undefined){ mrec(S.current).actuals[t.dataset.actual]=t.value; save(); renderClose(); return; }
  if(t.dataset&&t.dataset.set!==undefined){
    const p=t.dataset.set;
    let v = t.type==='checkbox' ? t.checked
          : t.type==='number' ? (parseFloat(t.value)||0)
          : t.value;
    if(p.startsWith('hide.')) v=!v;          // the switch reads "show"
    setSetting(p,v); return;
  }
  if(t.dataset&&t.dataset.title!==undefined){ setSetting('titles.'+t.dataset.title,t.value); return; }
  if(t.id==='setMe'){ setWhoAmI(t.value); renderAll(); toast('Saved on this device'); return; }
  if(t.dataset&&t.dataset.plan!==undefined){
    const pl=planById(t.dataset.id); if(pl){ pl[t.dataset.plan]=t.value; save(); renderAll(); } return;
  }
  if(t.dataset&&t.dataset.item!==undefined){
    const pl=planById(t.dataset.planId);
    const it=pl&&(pl.items||[]).find(i=>i.id===t.dataset.id);
    if(it){ it[t.dataset.item]=(t.type==='number')?(parseFloat(t.value)||0):t.value; save(); renderAll(); }
    return;
  }
  if(t.dataset&&t.dataset.member!==undefined){
    const m=memberById(t.dataset.id); if(m){ m[t.dataset.member]=t.value; save(); renderAll(); } return;
  }
  if(t.dataset&&t.dataset.ot!==undefined){
    const key=t.dataset.ot;
    ot()[key]=(t.type==='number'||key==='arrears')?(parseFloat(t.value)||0):t.value;
    if(key==='penOnOvertime') ot()[key]=t.checked;
    if(key==='rate'||key==='baseSalary'||key==='contractHours'||key==='weeksPerYear') relinkPay(key);
    save(); renderAll(); return;
  }
  if(t.dataset&&t.dataset.otcalc!==undefined){
    if(!S.otCalc) S.otCalc={target:5000,weeks:26,mult:'weekday'};
    S.otCalc[t.dataset.otcalc]=(t.type==='number')?(parseFloat(t.value)||0):t.value;
    save(); renderOt(); return;
  }
  if(t.dataset&&t.dataset.syncset!==undefined){
    sync()[t.dataset.syncset]=t.checked; saveVault(); renderAll(); return;
  }
  if(t.dataset&&t.dataset.pname!==undefined){
    const pr=profileById(t.dataset.pname); if(pr){ pr.name=t.value.trim()||pr.name; saveVault(); renderAll(); }
    return;
  }
  if(t.dataset&&t.dataset.pcolour!==undefined){
    const pr=profileById(t.dataset.pcolour); if(pr){ pr.colour=t.value; saveVault(); renderAll(); }
    return;
  }
  if(t.dataset&&t.dataset.potname!==undefined){
    const p=potList(), i=+t.dataset.potname, old=p[i].name, nu=t.value.trim()||old;
    S.items.forEach(x=>{ if(x.pot===old) x.pot=nu; });
    p[i].name=nu; save(); renderAll(); return;
  }
  if(t.dataset&&t.dataset.potcolor!==undefined){ potList()[+t.dataset.potcolor].color=t.value; save(); renderAll(); return; }
  if(t.id==='devName'||t.id==='devName2'){ setDeviceName(t.value.trim()); save(); renderAll(); return; }
  if(t.id==='chartMonth'){ chartMonth=t.value; renderTrend(); return; }
  if(t.id==='fileIn'){ if(t.files&&t.files[0]) importJson(t.files[0]); return; }
  if(f){
    const [kind,field]=f.split('.');
    const bank={income:S.income,item:S.items,debt:S.debts,oneoff:S.oneoffs,event:S.events}[kind];
    const o=bank&&bank.find(x=>x.id===t.dataset.id); if(!o) return;
    o[field]=(t.type==='number')?(parseFloat(t.value)||0):t.value;
    save(); renderAll(); return;
  }
});

function closeMonth(){
  const rec=mrec(S.current);
  const r0=buildRun();
  if(st('warnUncovered')&&r0.remaining>0.005){
    if(!confirm(`${gbp(r0.remaining)} on the run is still unticked. Close ${monthName(S.current)} anyway?`)) return;
  }
  const snap=liveSnapshot();          // capture before anything moves
  S.debts.forEach(d=>{
    const p=amountOf(d), int=(+d.balance||0)*(+d.apr||0)/100/12;
    const a=rec.actuals[d.id];
    d.balance=+((a!==undefined&&a!==''&&a!==null)?+a:Math.max(0,(+d.balance||0)+int-p)).toFixed(2);
  });
  // bank this month's contribution against each planned event
  (S.events||[]).forEach(e=>{
    const m=eventMonthly(e);
    if(m>0) e.saved=+(Math.min(+e.target||0,(+e.saved||0)+m)).toFixed(2);
  });
  rec.closed=true;
  S.history=S.history.filter(h=>h.month!==S.current);
  snap.debt=S.debts.reduce((a,d)=>a+(+d.balance||0),0);   // closing balance, post-payment
  S.history.push(snap);
  const next=shiftMonth(S.current,1);
  if(st('carryOneoffs')) S.oneoffs.forEach(o=>{ if(o.month===S.current) o.month=next; });
  S.current=next;
  const nrec=mrec(S.current);
  if(st('clearTicks')) nrec.ticks={};
  save(); renderAll(); toast('Rolled into '+monthName(S.current));
}
/* ---------- monthly statement → PDF ---------- */
function row(label,amount,cls){
  return `<div class="st-row ${cls||''}"><span class="l">${label}</span><i class="d"></i><span class="a">${amount}</span></div>`;
}
function buildStatement(){
  const k=S.current, r=buildRun(), rec=mrec(k);
  let h=`<div class="st-head">
    <h1 class="st-mark">${esc(st('appName'))}</h1>
    <div class="st-sub"><span>Monthly statement</span><span>${monthName(k)}</span>
      <span>${rec.closed?'Closed':'Open'}</span></div>
  </div>`;

  if(st('pdfIncome')){
    h+=`<div class="st-sec"><h4>Money in</h4>`;
    S.income.forEach(i=>h+=row(i.name+(i.received?'':' — not received'),gbp(i.received?i.amount:0)));
    h+=row('Total confirmed',gbp(r.income),'tot')+`</div>`;
  }

  r.sections.forEach(s=>{
    h+=`<div class="st-sec"><h4>${s.n} · ${s.title}</h4>`;
    s.lines.forEach(l=>{
      h+=row(l.name+(l.method==='dd'?' (direct debit)':''),gbp(l.amount));
      if(l.parts&&l.parts.length>1&&st('showBreakdowns')) l.parts.forEach(p=>h+=row(p.name,gbp(p.amount),'sub'));
    });
    h+=row('Section total',gbp(s.lines.reduce((a,l)=>a+l.amount,0)),'tot')+`</div>`;
  });

  h+=`<div class="st-sec">`+row('Total allocated',gbp(r.allocated),'tot')+`</div>
  <div class="st-live"><span>Money to live off</span>
    <b>${gbp(r.living)}</b>
    <span>${gbp(r.living/(+st('weeks')||4.345))} / week</span></div>`;

  if(S.debts.length&&st('pdfDebt')){
    h+=`<div class="st-sec"><h4>Debt reconciliation</h4><table class="st-tbl">
      <tr><th>Account</th><th>APR</th><th>Opened</th><th>Paid</th><th>Interest</th><th>Should be</th><th>Actually</th><th>Diff</th></tr>`;
    S.debts.forEach(d=>{
      const p=amountOf(d), int=(+d.balance||0)*(+d.apr||0)/100/12;
      const exp=Math.max(0,(+d.balance||0)+int-p);
      const a=rec.actuals[d.id], has=a!==undefined&&a!==null&&a!=='';
      const v=has?(+a-exp):0;
      h+=`<tr><td>${d.name}</td><td>${(+d.apr||0).toFixed(1)}%</td><td>${gbp(d.balance)}</td>
        <td>−${gbp(p)}</td><td>+${gbp(int)}</td><td>${gbp(exp)}</td>
        <td>${has?gbp(+a):'—'}</td><td>${has?(v>0?'+':'')+gbp(v):'—'}</td></tr>`;
    });
    h+=`<tr><td><b>Total owed</b></td><td></td><td><b>${gbp(S.debts.reduce((x,d)=>x+(+d.balance||0),0))}</b></td>
      <td colspan="5"></td></tr></table></div>`;
  }

  if((S.events||[]).length&&st('pdfEvents')){
    h+=`<div class="st-sec"><h4>${esc(title('s4'))}</h4><table class="st-tbl">
      <tr><th>Event</th><th>Needed by</th><th>Cost</th><th>Put by</th><th>To find</th><th>Per month</th></tr>`;
    S.events.forEach(e=>h+=`<tr><td>${e.name}</td><td>${monthName(e.dueMonth||k)}</td>
      <td>${gbp(e.target)}</td><td>${gbp(e.saved)}</td>
      <td>${gbp(Math.max(0,(+e.target||0)-(+e.saved||0)))}</td><td>${gbp(eventMonthly(e))}</td></tr>`);
    h+=`</table></div>`;
  }

  h+=`<div class="st-foot"><span>Prepared ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</span>
    <span>${esc(st('pdfFooter')||st('appName'))} · ${monthName(k)}</span></div>`;
  document.getElementById('statement').innerHTML=h;
}
function printStatement(){
  buildStatement();
  const t=document.title;
  document.title=`Bank of Bindi — ${monthName(S.current)}`;
  if(INFRAME){
    toast('Printing is blocked inside Claude — save the app to your phone first');
    document.title=t; return;
  }
  setTimeout(()=>{
    try{ window.print(); }
    catch(e){ toast('Printing was blocked — open the file directly in your browser'); }
    setTimeout(()=>{document.title=t;},600);
  },80);
}

const INFRAME = (function(){ try{ return window.self!==window.top; }catch(e){ return true; } })();
let pendingFile=null;

function rawDownload(name,text,type){
  try{
    const b=new Blob([text],{type}); const u=URL.createObjectURL(b);
    const a=document.createElement('a'); a.href=u; a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); },1200);
    return true;
  }catch(e){ return false; }
}
async function shareFile(){
  if(!pendingFile) return;
  try{
    const f=new File([pendingFile.text],pendingFile.name,{type:pendingFile.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:pendingFile.name}); return; }
    await navigator.share({title:pendingFile.name,text:pendingFile.text});
  }catch(e){ toast('Sharing was cancelled or unavailable'); }
}
function download(name,text,type){ showExport(name,text,type); }

function showExport(name,text,type){
  pendingFile={name,text,type};
  const canShare=!!(navigator.share);
  const kb=Math.max(1,Math.round(text.length/1024));
  const el=document.createElement('div');
  el.className='modal'; el.id='expModal';
  el.innerHTML=`<div class="sheet">
    <h3>Save your file</h3>
    <div class="sub">${esc(name)} · ${kb} KB${INFRAME?
      ' — downloads are blocked inside Claude, so use Copy or Share here. Save the app file to your phone and downloads will work normally.':''}</div>
    <div class="acts">
      ${canShare?`<button class="btn" id="expShare">Share</button>`:''}
      <button class="btn ${canShare?'ghost':''}" id="expDl">Download</button>
      <button class="btn ghost" id="expCopy">Copy text</button>
    </div>
    <textarea readonly id="expText">${esc(text).replace(/</g,'&lt;')}</textarea>
    <div class="acts" style="margin-top:12px"><button class="btn ghost" id="expClose">Close</button></div>
  </div>`;
  document.body.appendChild(el);
}
function closeExport(){ const m=document.getElementById('expModal'); if(m) m.remove(); pendingFile=null; }
async function copyExport(){
  const ta=document.getElementById('expText'); if(!ta) return;
  try{ await navigator.clipboard.writeText(ta.value); toast('Copied — paste it into a file'); return; }catch(e){}
  ta.removeAttribute('readonly'); ta.select(); ta.setSelectionRange(0,ta.value.length);
  try{ document.execCommand('copy'); toast('Copied'); }catch(e){ toast('Select the text and copy manually'); }
  ta.setAttribute('readonly','');
}
function exportCsv(){
  const r=buildRun();
  const rows=[['Section','Line','Method','Amount']];
  r.sections.forEach(s=>s.lines.forEach(l=>rows.push([s.title,l.name,l.method==='dd'?'Direct debit':'Transfer',l.amount.toFixed(2)])));
  rows.push(['','Money to live off','','' +r.living.toFixed(2)]);
  download(`bank-of-bindi-${S.current}.csv`,rows.map(x=>x.map(c=>`"${c}"`).join(',')).join('\n'),'text/csv');
  toast('CSV downloaded');
}
async function checkInstall(){
  const base=location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'');
  const files=['manifest.webmanifest','icon-192.png','icon-512.png','icon-maskable.png','sw.js'];
  const lines=[]; let bad=0;
  for(const f of files){
    try{
      const r=await fetch(base+f,{cache:'no-store'});
      const type=r.headers.get('content-type')||'';
      if(!r.ok){ lines.push('MISSING  '+f+'  ('+r.status+')'); bad++; }
      else if(f.endsWith('.png')&&!/image/.test(type)){ lines.push('WRONG TYPE  '+f+'  ('+type+')'); bad++; }
      else lines.push('ok  '+f);
    }catch(e){ lines.push('FAILED  '+f); bad++; }
  }
  let sw='no worker registered';
  try{
    if('serviceWorker' in navigator){
      const rs=await navigator.serviceWorker.getRegistrations();
      sw=rs.length?('worker active, scope '+rs[0].scope):'no worker registered';
    }
  }catch(e){}
  const standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  const report=
    'Address: '+base+'\n\n'+lines.join('\n')+'\n\n'+sw+'\nRunning '+(standalone?'installed':'in the browser')+
    '\n\n'+(bad?('>>> '+bad+' file(s) not reachable. Upload them into the same folder as index.html — that is what makes the icon come out grey.')
              :'>>> All present. If the icon is still grey, remove it and install again.');
  showExport('install-check.txt',report,'text/plain');
}
function exportVault(){
  download(`bank-of-bindi-vault-${new Date().toISOString().slice(0,10)}.json`,
    JSON.stringify(vault,null,2),'application/json');
  toast('Vault backed up — PIN profiles stay encrypted');
}
function exportJson(){
  if(!S.meta) S.meta={};
  S.meta.lastBackup=new Date().toISOString();
  S.meta.backupFrom=deviceName();
  download(`bank-of-bindi-backup-${S.current}-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S,null,2),'application/json');
  save(); renderStamp(); toast('Backup downloaded');
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
(async ()=>{
  await loadVault();
  if(sync().enabled&&sync().token){ try{ await syncNow(false); }catch(e){} }
  setInterval(()=>{ if(S) renderStamp(); },60000);
  ['click','keydown','input'].forEach(ev=>document.addEventListener(ev,touchIdle,{passive:true}));
  if(!vault.profiles.length){ lkMode='new'; renderLock(); return; }
  const last=vault.last&&profileById(vault.last);
  if(last&&!last.locked){ await openProfile(last.id); unlockUI(); }
  else { lkPick=last?last.id:vault.profiles[0].id; renderLock(); }
})();
